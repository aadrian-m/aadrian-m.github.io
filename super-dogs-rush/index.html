<script>
(function(){
'use strict';
const W=360;let H=640,mOff=0;                 // logical game size
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,ox=0,oy=0,dpr=1,safeT=0,safeB=0,safeL=0,safeR=0;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);
  const w=window.innerWidth,h=window.innerHeight;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  scale=Math.min(w/W,h/640);H=Math.max(640,Math.min(900,h/scale));scale=Math.min(w/W,h/H);ox=(w-W*scale)/2;oy=(h-H*scale)/2;try{player.y=H*0.78}catch(e){}
  // v12: safe-area insets (notch / home bar / rounded corners) in logical units, only the part that overlaps the game area
  let it=0,ib=0,il=0,ir=0;
  try{const cs=window.getComputedStyle(document.getElementById('sa'));
    it=parseFloat(cs.paddingTop)||0;ib=parseFloat(cs.paddingBottom)||0;il=parseFloat(cs.paddingLeft)||0;ir=parseFloat(cs.paddingRight)||0}catch(e){}
  safeT=Math.max(0,(it-oy)/scale);safeB=Math.max(0,(ib-oy)/scale);safeL=Math.max(0,(il-ox)/scale);safeR=Math.max(0,(ir-ox)/scale);
  if(!(safeT>=0&&safeT<80))safeT=0;if(!(safeB>=0&&safeB<80))safeB=0;if(!(safeL>=0&&safeL<80))safeL=0;if(!(safeR>=0&&safeR<80))safeR=0;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));
resize();

// ---------- storage ----------
const liveEl=document.getElementById('live');function say(m){try{liveEl.textContent=m}catch(e){}}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
let SET=Object.assign({music:1,shake:1,haptics:1,rm:0,vol:7,cb:0,big:0,left:0,sens:3,hc:0,mvol:7,diff:1,pob:1,fx:1,gm:1,gu:1,gh:0},(function(){try{return JSON.parse(localStorage.getItem('sdr_set'))||{}}catch(e){return{}}})());
SET.sens=Math.max(1,Math.min(5,Math.round(+SET.sens)||3));SET.vol=Math.max(0,Math.min(10,Math.round(+SET.vol)||0));SET.mvol=Math.max(0,Math.min(10,Math.round(+SET.mvol)||0));SET.hc=SET.hc?1:0;SET.pob=SET.pob===0||SET.pob==="0"?0:1;SET.gm=SET.gm===0||SET.gm==="0"?0:1;SET.gu=SET.gu===0||SET.gu==="0"?0:1;SET.diff=(+SET.diff===0||+SET.diff===2)?+SET.diff:1;
const SENS=[1.0,1.3,1.6,2.0,2.5];
function saveSet(){lsSet('sdr_set',JSON.stringify(SET))}
let bestN=parseInt(lsGet('sdr_best','0'),10)||0,bestH=parseInt(lsGet('sdr_best_h','0'),10)||0;
let best=bestN;   // v15: 'best' = best for the currently selected mode (Normal or Hard); Practice shows Normal
function syncBest(){best=SET.diff===2?bestH:bestN}
syncBest();
let totalCoins=parseInt(lsGet('sdr_total','0'),10)||0;   // lifetime fake coins -> unlocks skins
let skinIdx=parseInt(lsGet('sdr_skin','0'),10)||0;
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let dayKey=todayKey();
// v10: prune daily tables from previous days
function pruneDaily(){try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&(k.indexOf('sdr_dlb_')===0&&k!=='sdr_dlb_'+dayKey||k.indexOf('sdr_ghost_')===0&&k!=='sdr_ghost_'+dayKey))localStorage.removeItem(k)}}catch(e){}}
pruneDaily();
let dailyBest=parseInt(lsGet('sdr_daily_'+dayKey,'0'),10)||0;
let dStreak=parseInt(lsGet('sdr_dstreak','0'),10)||0,dLast=lsGet('sdr_dlast','');
function dayKeyOff(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
if(dLast!==dayKey&&dLast!==dayKeyOff(-1))dStreak=0;   // streak lapsed
// v22: recompute the day on each daily start (and on title idle) so a tab left open past midnight gets the new seed/modifier
function refreshDay(){const k=todayKey();if(k===dayKey)return false;dayKey=k;dailyMod=seedFromKey(dayKey+'#mod')%DMODS.length;pruneDaily();dailyBest=parseInt(lsGet('sdr_daily_'+dayKey,'0'),10)||0;dlb=lsJSON('sdr_dlb_'+dayKey,[]);if(!Array.isArray(dlb))dlb=[];if(dLast!==dayKey&&dLast!==dayKeyOff(-1))dStreak=0;return true}
let shareMsg='',shareT=0;
// v21 badges: persisted ids; each pays +25 lifetime coins (progress toward skins). Not awarded in Practice.
const ACH=[{id:'p500',n:'Warm-up',d:'Score 500 in a run'},{id:'p1500',n:'Rushing Yards',d:'Score 1500 in a run'},{id:'coins50',n:'Piggy Bank',d:'50 coins in one run'},{id:'graze4',n:'Needle Thread',d:'GRAZE chain x4'},{id:'wall3',n:'Gap Master',d:'Clear 3 walls in one run'},{id:'boss',n:'Boss Smasher',d:'Smash a boss'},{id:'curse',n:'Curse Breaker',d:'Survive a cursed coin'},{id:'daily',n:'Daily Driver',d:'Finish a daily run'},{id:'stiff',n:'Stiff Upper Arm',d:'Shove 4 defenders in one Stiff-Arm'},{id:'strike2',n:'Strike Force',d:'2 STRIKEs in one run'},{id:'gust5',n:'Wind Rider',d:'Ride out 5 gusts in one run'},{id:'gust10',n:'Storm Chaser',d:'Ride out 10 gusts in one run'},{id:'tail4',n:'Tailwind',d:'Reach a x4 ride streak'},{id:'gale',n:'Gale Breaker',d:'Dash through 3 gusts in one run'}];
let achDone=[];try{achDone=JSON.parse(localStorage.getItem('sdr_ach')||'[]');if(!Array.isArray(achDone))achDone=[]}catch(e){achDone=[]}
// v22 tiers: a badge earned in 1 / 5 / 20 separate runs is bronze / silver / gold (pays +25 / +50 / +100 once per tier). sdr_ach stays the list of bronze+ ids.
const TIERS=['','BRONZE','SILVER','GOLD'],TIER_AT=[0,1,5,20],TIER_COIN=[0,25,50,100],TIER_COL=['#7a9a82','#cd7f32','#c0c8d0','#ffd700'];
let achCnt={};try{achCnt=JSON.parse(localStorage.getItem('sdr_acht')||'{}');if(!achCnt||typeof achCnt!=='object'||Array.isArray(achCnt))achCnt={}}catch(e){achCnt={}}
achDone.forEach(id=>{if(!achCnt[id])achCnt[id]=1});   // v21 saves migrate as bronze
let runEarned=[];
function tierOf(id){const n=achCnt[id]||0;return n>=20?3:n>=5?2:n>=1?1:0}
function award(id){
  if(runDiff===0&&!daily)return;
  const a=ACH.find(q=>q.id===id);if(!a)return;
  if(runEarned.indexOf(id)>=0)return;runEarned.push(id);
  const before=tierOf(id);achCnt[id]=(achCnt[id]||0)+1;const after=tierOf(id);lsSet('sdr_acht',JSON.stringify(achCnt));
  if(achDone.indexOf(id)<0){achDone.push(id);lsSet('sdr_ach',JSON.stringify(achDone))}
  if(after>before){const c=TIER_COIN[after];achBonus+=c;toastS=TIERS[after]+' BADGE: '+a.n+'  +'+c;toastT=2.6;sfx.badge();say(TIERS[after]+' badge: '+a.n)}
}
function milestone(s){
  sfx.fan();flashA=reduceMotion?0:0.35;addCharge(0.15);floatText(W/2,H*0.45,'SCORE '+s+'!','#fff59d');ring(player.x,player.y,'#fff59d');shake=Math.max(shake,reduceMotion?0:0.1);vib(15);
  if(s>=500)award('p500');if(s>=1500)award('p1500');
}
function vib(ms){try{if(navigator.vibrate&&SET.haptics&&!reduceMotion)navigator.vibrate(ms)}catch(e){}}
function lsJSON(k,d){try{const v=JSON.parse(lsGet(k,''));return v==null?d:v}catch(e){return d}}
let lb=lsJSON('sdr_lb',[]);if(!Array.isArray(lb))lb=[];
let lbN=lsJSON('sdr_lb_n',[]),lbH=lsJSON('sdr_lb_h',[]);if(!Array.isArray(lbN))lbN=[];if(!Array.isArray(lbH))lbH=[];   // v17: per-mode top-5 (Normal / Hard)
let lbRankM=-1;
let stats=Object.assign({runs:0,bestScore:0,bestYards:0,bestCoins:0,totalYards:0,walls:0,strikes:0,bestStrikes:0,bestStk:0,gusts:0},lsJSON('sdr_stats',{}));
let hs=lsJSON('sdr_hscores',[]);if(!Array.isArray(hs))hs=[];let sparkH=0;
let deaths=lsJSON('sdr_deaths',[]);if(!Array.isArray(deaths))deaths=[];
let statsPage=0,lbRank=-1,lbMode=0;   // v17 lbMode 0=all runs, 1=today's daily, 2=Normal, 3=Hard
let dlb=lsJSON('sdr_dlb_'+dayKey,[]);if(!Array.isArray(dlb))dlb=[];
let resetArm=0;
function resetStats(){
  if(!resetArm){resetArm=1;setTimeout(()=>{resetArm=0},3000);sfx.click();say('Tap RESET again to erase scores and stats');return}
  resetArm=0;best=0;bestN=0;bestH=0;stats={runs:0,bestScore:0,bestYards:0,bestCoins:0,totalYards:0,walls:0,strikes:0,bestStrikes:0};lb=[];lbN=[];lbH=[];dlb=[];deaths=[];hs=[];lbRank=-1;lbRankM=-1;
  ['sdr_best','sdr_best_h','sdr_stats','sdr_lb','sdr_lb_n','sdr_lb_h','sdr_deaths','sdr_hscores','sdr_gbest_1','sdr_gbest_2','sdr_dlb_'+dayKey].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  sfx.click();say('Scores and stats erased');
}
function recordRun(s,yards,killer){
  stats.runs++;stats.totalYards+=yards;
  if(runDiff===2&&!daily){hs.push(s);if(hs.length>20)hs=hs.slice(-20);lsSet('sdr_hscores',JSON.stringify(hs))}   // v34: Hard sparkline
  if(s>stats.bestScore)stats.bestScore=s;if(yards>stats.bestYards)stats.bestYards=yards;if(coins>stats.bestCoins)stats.bestCoins=coins;
  stats.walls+=wallsCleared;stats.strikes=(stats.strikes||0)+strikes;if(strikes>(stats.bestStrikes||0))stats.bestStrikes=strikes;stats.gusts=(stats.gusts||0)+gustN;if(runStk>(stats.bestStk||0))stats.bestStk=runStk;
  lsSet('sdr_stats',JSON.stringify(stats));
  const e={s,y:yards,c:coins,d:daily?dayKey:'',n:Date.now()};
  lb.push(e);lb.sort((a,b)=>b.s-a.s||a.n-b.n);lbRank=lb.indexOf(e);lb=lb.slice(0,5);if(lbRank>4)lbRank=-1;
  lsSet('sdr_lb',JSON.stringify(lb));
  lbRankM=-1;if(!daily&&runDiff!==0){const A=runDiff===2?lbH:lbN;A.push(e);A.sort((a,b)=>b.s-a.s||a.n-b.n);lbRankM=A.indexOf(e);const B=A.slice(0,5);if(lbRankM>4)lbRankM=-1;if(runDiff===2)lbH=B;else lbN=B;lsSet(runDiff===2?'sdr_lb_h':'sdr_lb_n',JSON.stringify(B))}
  if(daily){dlb.push(e);dlb.sort((a,b)=>b.s-a.s||a.n-b.n);dlb=dlb.slice(0,5);lsSet('sdr_dlb_'+dayKey,JSON.stringify(dlb));if(lbRank<0)lbRank=-1}
  if(daily||runDiff===1)deaths.push({y:yards,k:killer,t:Math.round(t*10)/10,s,m:daily?1:0,n:Date.now()});   // for difficulty tuning (last 200 runs)
  if(deaths.length>200)deaths=deaths.slice(-200);
  lsSet('sdr_deaths',JSON.stringify(deaths));
}
function saveBest(){lsSet('sdr_best',bestN);lsSet('sdr_best_h',bestH)}
const SKINS=[
  {name:'Classic',jersey:'#ffcc00',num:'#1b3a8c',need:0,fx:'bars'},
  {name:'Night Owl',jersey:'#7e57c2',num:'#ffffff',need:100,fx:'stars'},
  {name:'Mint',jersey:'#26c6a0',num:'#06352b',need:300,fx:'rings'},
  {name:'Hot Pink',jersey:'#ff4081',num:'#ffffff',need:600,fx:'hearts'},
  {name:'Ice',jersey:'#e3f2fd',num:'#0d47a1',need:1000,fx:'flakes'},
  {name:'Gold Legend',jersey:'#ffd700',num:'#5d4037',need:2000,fx:'comet'}
];
if(skinIdx>=SKINS.length||SKINS[skinIdx].need>totalCoins)skinIdx=0;
// seeded RNG (daily challenge uses a date seed so everyone gets the same field)
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedFromKey(k){let h=2166136261;for(let i=0;i<k.length;i++){h^=k.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
let rng=Math.random,daily=false,acc=0;
const osRM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let reduceMotion=osRM||!!SET.rm;   // v9: OS setting OR in-game override

// ---------- audio (muted by default) ----------
let synergy=0;
let muted=lsGet('sdr_muted','0')==='1',actx=null,master=null,mgain=null;
function volGain(){const v=Math.max(0,Math.min(10,+SET.vol));return isFinite(v)?(v/10)*(v/10):0.49}   // v10 master volume (0-10, squared curve)
function mvolGain(){const v=Math.max(0,Math.min(10,+SET.mvol));return isFinite(v)?(v/10)*(v/10):0.49}   // v13 separate music volume
function applyVol(){if(master)master.gain.value=volGain();if(mgain)mgain.gain.value=mvolGain()}
function initAudio(){
  if(actx){if(actx.state==='suspended')actx.resume();return}
  try{const A=window.AudioContext||window.webkitAudioContext;if(A){actx=new A();master=actx.createGain();master.gain.value=volGain();master.connect(actx.destination);mgain=actx.createGain();mgain.gain.value=mvolGain();mgain.connect(master)}}catch(e){}
}
function tone(f,d,type,vol,slide){
  if(muted||!actx)return;
  const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(vol||0.08,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(master||actx.destination);o.start(t);o.stop(t+d+0.02);
}
const sfx={
  coin(){const m=[1,1.06,1.12,1.19,1.26,1.5][skinIdx]||1,w=['square','square','triangle','sine','triangle','sawtooth'][skinIdx]||'square';const cm=1+0.06*(Math.min(5,combo)-1);tone(880*m*cm,0.08,w,0.06);setTimeout(()=>tone(1320*m*cm,0.1,w,0.06),60)},
  shield(){tone(400,0.25,'sine',0.1,2.5)},
  badge(){[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.14,'triangle',0.07),i*70))},
  fan(){[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'square',0.05),i*60))},
  graze(){tone(1320+Math.min(6,streak%5)*90,0.05,'triangle',0.04)},
  curse(){tone(220,0.35,'sawtooth',0.09,0.5);setTimeout(()=>tone(165,0.3,'square',0.07,0.6),120)},
  block(){tone(300,0.2,'sawtooth',0.08,0.4)},
  ride(n){tone(520+90*n,0.12,'triangle',0.06);setTimeout(()=>tone(780+120*n,0.16,'triangle',0.06),90)},
  gust(d){tone(d>0?300:240,0.9,'sine',0.05,d>0?2:0.5)},
  stage(){[392,523,659].forEach((f,i)=>setTimeout(()=>tone(f,0.14,'triangle',0.07),i*80))},
  hit(){tone(220,0.5,'sawtooth',0.12,0.2)},
  click(){tone(600,0.05,'square',0.05)},
  juke(){tone(500,0.1,'triangle',0.06,1.6)},
  power(){tone(500,0.3,'triangle',0.09,2.2)},
  dash(){const m=[1,0.9,1.2,1.5,1.8,0.75][skinIdx]||1;tone(200*m,0.35,['sawtooth','sawtooth','sine','triangle','sine','square'][skinIdx]||'sawtooth',0.1,4)},
  smash(){tone(160,0.12,'square',0.09,0.5)},
  strike(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.08),i*55))},
  ready(){tone(700,0.1,'triangle',0.08);setTimeout(()=>tone(1050,0.15,'triangle',0.08),90)},
  tick(){tone(520,0.06,'sine',0.07)},
  stage(){[392,523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'square',0.06),i*80))},
  best(){[784,988,1175,1568].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'triangle',0.08),i*70))},
  near(){tone(1500,0.05,'sine',0.05,1.5)},
  whoosh(){tone(300,0.25,'sawtooth',0.04,3)},

  warn(){tone(900,0.12,'square',0.05,0.5);setTimeout(()=>tone(900,0.12,'square',0.05,0.5),140)}
};

// ---------- procedural music loop (v6; follows the mute toggle, plays only in a run) ----------
const music={on:false,next:0,step:0,timer:0,
  // v7: 4-chord progression (Am F C G), 4 lead shapes rotating every 4 bars, kick joins later in the run
  chords:[[110,131,165],[87.3,110,131],[130.8,164.8,196],[98,123.5,147]],
  shapes:[[0,1,0,2,0,3,2,0],[3,0,2,0,1,0,2,3],[0,2,0,3,0,2,0,1],[1,0,3,0,2,0,3,2]],
  note(f,d,type,vol,at){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(0.0001,at+d);o.connect(g);g.connect(mgain||master||actx.destination);o.start(at);o.stop(at+d+0.02)},
  kick(at){const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.setValueAtTime(140,at);o.frequency.exponentialRampToValueAtTime(45,at+0.12);
    g.gain.setValueAtTime(0.09,at);g.gain.exponentialRampToValueAtTime(0.0001,at+0.14);o.connect(g);g.connect(mgain||master||actx.destination);o.start(at);o.stop(at+0.16)},
  tick(){
    if(!actx||muted||!SET.music||state!=='play'||countdown>0||actx.state!=='running'){this.next=0;return}
    const bpm=112+Math.min(40,t*0.35),sp=60/bpm/2,now=actx.currentTime;
    if(!this.next||this.next<now-0.3)this.next=now+0.05;
    while(this.next<now+0.25){
      const i=this.step++,at=this.next,bar=i>>3,pos=i&7,ch=this.chords[bar&3],sh=this.shapes[(bar>>2)&3];
      if(!(pos&1))this.note(ch[0]*(pos===4?1.5:1),sp*1.6,'triangle',0.07,at);
      const ti=sh[pos];if(pos&1||ti){const f=ch[ti%3]*(ti>2?4:2)*((bar>>4)&1&&pos===7?2:1);if(!(pos===0&&!ti))this.note(f,sp*0.8,'square',0.025,at)}
      if(i%4===2)this.note(3000,0.03,'square',0.012,at);
      if(t>40&&pos%4===0)this.kick(at);
      this.next+=sp;
    }
  }};
setInterval(()=>{try{music.tick()}catch(e){}},80);

// ---------- game state ----------

  const L=(o)=>{if(o.px===undefined)return;_sv.push([o,o.x,o.y,o.gc]);o.x=o.px+(o.x-o.px)*a;if(o.py!==undefined)o.y=o.py+(o.y-o.py)*a;if(o.pgc!==undefined)o.gc=o.pgc+(o.gc-o.pgc)*a};
  L(player);for(const arr of [defs,pickups,walls,parts])for(const o of arr)L(o);
  _sv.push(scroll);let d=scroll-pscroll;if(d>0)d-=80;scroll=pscroll+d*a;if(scroll<0)scroll+=80;   // scroll wraps mod 80 (it only increases)
}
function lerpRestore(){
  if(!_sv.length)return;
  const sc=_sv.find(v=>typeof v==='number');
  for(const v of _sv)if(typeof v!=='number'){v[0].x=v[1];v[0].y=v[2];if(v[3]!==undefined)v[0].gc=v[3]}
  if(sc!==undefined)scroll=sc;_sv=[];
}

  ctx.save();
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  if(shake>0&&SET.shake&&!reduceMotion)ctx.translate((Math.random()-0.5)*10*shake*2,(Math.random()-0.5)*10*shake*2);
  lerpApply(state==='play'&&countdown<=0?Math.max(0,Math.min(1,acc/STEP)):1);
  drawField();

  if(dashT>0)drawDashFx(SKINS[skinIdx].fx,player.x,player.y);
  if(ghostPlay&&state==='play'&&countdown<=0){const gf=t/0.1,gi=Math.floor(gf);if(gi+1<ghostPlay.length){const gx=ghostPlay[gi]+(ghostPlay[gi+1]-ghostPlay[gi])*(gf-gi);ctx.globalAlpha=0.5;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.beginPath();ctx.ellipse(gx,player.y+2,17,21,0,0,6.2832);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=0.35;drawDog(gx,player.y,0,0,0,false,SKINS[skinIdx]);ctx.globalAlpha=1;text('BEST',gx,player.y-(Math.abs(gx-player.x)<24?42:30),10,'#fff')}}
  for(const g of ghosts){ctx.globalAlpha=g.life*1.6;drawDog(g.x,g.y,0,0,0,false,SKINS[skinIdx])}ctx.globalAlpha=1;

    if(dbl>0){ctx.strokeStyle='rgba(255,224,102,'+(0.5+0.3*Math.sin(t*9))+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(player.x,player.y,22,0,6.283);ctx.stroke();ctx.lineWidth=1}

// ---------- input ----------
let focusIdx=-1,focusId='',focusState='',dragId=null,lastPX=0,dragY0=0,dragT0=0,swiped=false;
function toLogical(e){return{x:(e.clientX-ox)/scale,y:(e.clientY-oy)/scale}}
// v23: one-time how-to before the very first run (flag sdr_howto); also reachable from title and pause
function firstHowTo(d){if(lsGet('sdr_howto','0')!=='0')return false;helpFirst=true;helpFrom='title';pendingDaily=d;state='help';sfx.click();return true}
function press(id){
  initAudio();
  switch(id){
    case 'play':if(state==='over'&&gameOverT<0.8)break;if(firstHowTo(false))break;startGame(daily&&state==='over');break;
    default:if(id.indexOf('skin')===0&&state==='skins'){const i=+id.slice(4);if(SKINS[i]&&SKINS[i].need<=totalCoins){skinIdx=i;lsSet('sdr_skin',i);sfx.click()}}
    break;
    case 'daily':if(firstHowTo(true))break;startGame(true);break;
    case 'skin':state='skins';sfx.click();break;
    case 'stats':state='stats';statsPage=0;sfx.click();break;
    case 'help':helpFrom=state==='pause'?'pause':'title';helpFirst=false;state='help';sfx.click();break;
    case 'helpgo':lsSet('sdr_howto','1');helpFirst=false;sfx.click();startGame(pendingDaily);break;
    case 'bprev':badgePg=Math.max(0,badgePg-1);sfx.click();break;
    case 'bnext':badgePg=Math.min(Math.ceil(ACH.length/BPP)-1,badgePg+1);sfx.click();break;
    case 'badges':state='badges';badgePg=0;sfx.click();break;
    case 'back':state=state==='help'&&helpFrom==='pause'?'pause':'title';sfx.click();break;
    case 'title':state='title';reset();sfx.click();break;
    case 'resume':resumeGame();sfx.click();break;
    case 'dash':doDash();break;
    case 'pause':pause();sfx.click();break;
    case 'mute':toggleMute();break;
    case 'mode0':case 'mode1':case 'mode2':SET.diff=+id[4];syncBest();saveSet();sfx.click();say('Mode '+DIFF[SET.diff].n);break;
    case 'diff':SET.diff=(SET.diff+1)%3;syncBest();saveSet();sfx.click();say('Mode '+DIFF[SET.diff].n);break;
    case 'set':state='settings';sfx.click();say('Settings');break;
    case 'set_snd':toggleMute();break;
    case 'set_mus':SET.music=SET.music?0:1;saveSet();sfx.click();break;
    case 'set_shk':SET.shake=SET.shake?0:1;saveSet();sfx.click();break;
    case 'set_hap':SET.haptics=SET.haptics?0:1;saveSet();sfx.click();break;
    case 'set_rm':SET.rm=SET.rm?0:1;reduceMotion=osRM||!!SET.rm;saveSet();sfx.click();break;
    case 'set_gu':SET.gu=SET.gu?0:1;if(!SET.gu){gust.w=0;gust.a=0}saveSet();sfx.click();say('Gusts '+(SET.gu?'on':'off'));break;
    case 'set_gm':SET.gm=SET.gm?0:1;saveSet();sfx.click();say('Wall gap arrow '+(SET.gm?'on':'off'));break;
    case 'set_fx':SET.fx=SET.fx?0:1;saveSet();sfx.click();say('Visual effects '+(SET.fx?'on':'off'));break;
    case 'set_pob':SET.pob=SET.pob?0:1;saveSet();sfx.click();say('Pause on focus loss '+(SET.pob?'on':'off'));break;
    case 'set_cb':SET.cb=SET.cb?0:1;saveSet();sfx.click();break;
    case 'set_vd':SET.vol=Math.max(0,SET.vol-1);saveSet();applyVol();sfx.click();say('Volume '+SET.vol);break;
    case 'set_vu':SET.vol=Math.min(10,SET.vol+1);saveSet();applyVol();sfx.click();say('Volume '+SET.vol);break;
    case 'set_hc':SET.hc=SET.hc?0:1;saveSet();sfx.click();say('High contrast outline '+(SET.hc?'on':'off'));break;
    case 'set_md':SET.mvol=Math.max(0,SET.mvol-1);saveSet();applyVol();sfx.click();say('Music volume '+SET.mvol);break;
    case 'set_mu':SET.mvol=Math.min(10,SET.mvol+1);saveSet();applyVol();sfx.click();say('Music volume '+SET.mvol);break;
    case 'set_big':SET.big=SET.big?0:1;saveSet();sfx.click();break;
    case 'set_side':SET.left=SET.left?0:1;saveSet();sfx.click();say('Dash button on the '+(SET.left?'left':'right'));break;
    case 'set_sd':SET.sens=Math.max(1,SET.sens-1);saveSet();sfx.click();say('Steer speed '+SET.sens);break;
    case 'set_su':SET.sens=Math.min(5,SET.sens+1);saveSet();sfx.click();say('Steer speed '+SET.sens);break;
    case 'reset':resetStats();break;
    case 'spage':statsPage=statsPage?0:1;sfx.click();break;

const sb=document.getElementById('sb'),sbt=document.getElementById('sbt'),sbm=document.getElementById('sbm');
function inSb(e){return e.target&&e.target.closest&&e.target.closest('#sb')}
function showShareBox(txt,msg){
  sbm.textContent=msg||'Copy your score:';sbt.value=txt;sb.style.display='block';
  try{sbt.focus();sbt.select();sbt.setSelectionRange(0,txt.length)}catch(e){}
}
document.getElementById('sbc').addEventListener('click',()=>{sb.style.display='none';sbt.blur()});
function share(){
  const txt='Super Dogs Rush'+(daily?' Daily '+dayKey+' ['+DMODS[dailyMod].n+']':'')+': '+score()+' pts, '+Math.floor(dist/10)+' yds, '+coins+' coins, stage '+stage+(gustN?', '+gustN+' gusts ridden'+(runStk>1?' (best streak x'+runStk+')':''):'')+(daily&&dStreak>1?' ('+dStreak+'-day streak)':'');
  const done=m=>{shareMsg=m;setTimeout(()=>{shareMsg=''},2000)};
  const fallback=()=>{   // clipboard API unavailable/blocked (e.g. file://): try execCommand, then show selectable text
    showShareBox(txt);
    try{if(document.execCommand&&document.execCommand('copy')){sbm.textContent='Copied! (or copy manually):';done('COPIED!')}}catch(e){}
  };
  try{
    if(navigator.share){navigator.share({text:txt}).then(()=>done('SHARED'),err=>{if(!err||err.name!=='AbortError')fallback()});return}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>done('COPIED!'),fallback);return}
  }catch(e){}
  fallback();
}
function toggleMute(){muted=!muted;lsSet('sdr_muted',muted?'1':'0');initAudio();if(!muted)sfx.click()}
let swX=null;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();
  const p=toLogical(e);swX=state==='stats'?p.x:null;
  for(const b of buttons){
    if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){
      swX=null;press(b.id);
      if(state!=='play')return;
      if(b.id==='pause'||b.id==='mute'||b.id==='dash')return;
      break;   // game just started from this touch: begin steering immediately
    }
  }
  if(state==='play'&&dragId!==null&&e.pointerId!==dragId){if(dashCharge>=1)tip('t_2f','TWO FINGERS','A second finger tapped anywhere also dashes');doDash();return}   // v26: 2nd finger anywhere = DASH while steering
  if(state==='play'&&dragId===null){dragId=e.pointerId;lastPX=p.x;dragY0=p.y;dragT0=performance.now();swiped=false;try{cv.setPointerCapture(e.pointerId)}catch(_){}}
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==dragId)return;e.preventDefault();
  const p=toLogical(e);player.tx+=(p.x-lastPX)*SENS[SET.sens-1]*(mir()?-1:1);lastPX=p.x;
  if(!swiped&&state==='play'&&dragY0-p.y>70&&performance.now()-dragT0<350){swiped=true;doDash()}   // v9: quick swipe up = DASH
  else if(performance.now()-dragT0>350){dragY0=p.y;dragT0=performance.now()}
},{passive:false});
function endDrag(e){if(e.pointerId===dragId)dragId=null}
cv.addEventListener('pointerup',e=>{if(swX!==null&&state==='stats'){const dx=toLogical(e).x-swX;if(Math.abs(dx)>60&&(dx<0)===(statsPage===0)){statsPage=statsPage?0:1;sfx.click()}}swX=null;endDrag(e)});cv.addEventListener('pointercancel',endDrag);
// block iOS gestures / scroll / zoom
['touchstart','touchmove','gesturestart','gesturechange','contextmenu'].forEach(n=>
  document.addEventListener(n,e=>{if(!inSb(e))e.preventDefault()},{passive:false}));
let lastTap=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTap<350&&!inSb(e))e.preventDefault();lastTap=n},{passive:false});

window.addEventListener('keydown',e=>{
  if(inSb(e))return;
  keys[e.key.toLowerCase()]=true;
  if(e.repeat&&(state!=='play'||e.key.toLowerCase()!=='p'))return;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  initAudio();
  const k=e.key.toLowerCase();
  if(k==='m')toggleMute();
  if(k==='`'||k==='f3'){dbg=!dbg;lsSet('sdr_dbg',dbg?'1':'0');e.preventDefault()}
  if(state!=='play'&&(k==='tab'||k==='arrowdown'||k==='arrowup')){e.preventDefault();const L=buttons.filter(b=>b.id!=='dbg'&&b.id!=='mute');if(L.length){const dirn=(k==='arrowup'||e.shiftKey)?-1:1;focusIdx=(focusIdx+dirn+L.length)%L.length;focusId=L[focusIdx].id;say('Focus: '+focusId)}return}
  if(state!=='play'&&focusId&&(k==='enter'||k===' ')&&(state!=='over'||gameOverT>0.8)){const id=focusId;press(id);return}
  if(state==='title'&&(k==='enter'||k===' ')){if(!firstHowTo(false))startGame(false)}
  else if(state==='help'&&helpFirst&&(k==='enter'||k===' '))press('helpgo');
  else if(state==='help'&&helpFrom==='pause'&&(k==='enter'||k==='escape'))state='pause';
  else if(state==='over'&&gameOverT>0.2&&(k==='escape'||k==='backspace'))press('title');
  else if(state==='over'&&gameOverT>0.8&&(k==='enter'||k==='r'))startGame(daily);   // v35: Space no longer restarts (it is the dash key)
  else if(state==='stats'&&(k==='arrowright'||k==='arrowleft'||k==='pagedown'||k==='pageup'))press('spage');
  else if((state==='help'||state==='badges'||state==='skins'||state==='stats'||state==='settings')&&(k==='enter'||k==='escape'))state='title';
  else if(state==='play'&&(k==='p'||k==='escape'))pause();
  else if(state==='pause'&&(k==='p'||k==='escape'||k==='enter'))resumeGame();
  else if(state==='play'&&(k===' '||k==='arrowup'||k==='w'||k==='shift'))doDash();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(SET.pob&&state==='play'){pause();last=0}});   // v17: optional pause on focus loss   // v6: blur no longer pauses (only hiding the tab does)
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();last=0;if(actx&&actx.state==='running')actx.suspend()}
  else if(actx&&!muted)actx.resume()});

// ---------- main loop ----------
// v10 gamepad: left stick / d-pad steer, A/B/X/Y or RT = dash, Start = pause/start/back
let gpPrev={},gpAx=0;
function pollPad(){
  let g=null;try{const l=navigator.getGamepads?navigator.getGamepads():[];for(const x of l)if(x&&x.connected){g=x;break}}catch(e){}
  if(!g){gpAx=0;return}
  const B=i=>!!(g.buttons[i]&&g.buttons[i].pressed),E=(n,v)=>{const r=v&&!gpPrev[n];gpPrev[n]=v;return r};
  let ax=+g.axes[0]||0;if(!isFinite(ax)||Math.abs(ax)<0.2)ax=0;if(B(14))ax=-1;if(B(15))ax=1;gpAx=ax;
  const dash=E('d',B(0)||B(1)||B(2)||B(3)||B(7)),start=E('s',B(9)),up=E('u',B(12)),dn=E('n',B(13));
  if(dash||start||up||dn)initAudio();
  if(state==='play'){if(dash)doDash();if(start)pause()}
  else if(state==='pause'){if(start||dash)resumeGame()}
  else if(state==='title'||(state==='over'&&gameOverT>0.8)){if(start||(dash&&state==='title'))startGame(state==='over'&&daily)}
  else if(state!=='over'){if(start)state='title'}
}
let last=0;
const STEP=1/120;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  const dt=Math.min(0.05,(ts-last)/1000);last=ts;
  try{pollPad()}catch(e){}
  if(state==='play'){   // fixed timestep: simulation advances in exact STEP increments (deterministic for a given input sequence)
    acc+=dt;let n=0;steps=0;
    while(acc>=STEP&&n<8&&state==='play'){update(STEP);acc-=STEP;n++}
    steps=n;if(state!=='play')acc=0;
  }else{acc=0;updateIdle(dt)}
  if(toastT>0&&(state==='play'||state==='pause'||state==='over'))toastT-=dt;if(flashA>0)flashA=Math.max(0,flashA-dt*1.2);
  fpsN++;fpsT+=dt;if(fpsT>=0.5){fps=Math.round(fpsN/fpsT);fpsN=0;fpsT=0}
  ialpha=state==='play'?Math.min(1,acc/STEP):1;
  render();
}
// ---------- v7 PWA: runtime-built icon + manifest (single file, no external assets) ----------

      g.fillStyle='#0b3d1e';g.fillRect(0,0,n,n);g.fillStyle='#22883f';g.fillRect(0,n*0.62,n,n*0.38);
      g.fillStyle='#ffcc00';g.beginPath();g.arc(n/2,n*0.68,48*u,Math.PI,0);g.fillRect(n/2-48*u,n*0.68,96*u,34*u);g.fill();   // jersey
      g.fillStyle='#c68642';g.beginPath();g.arc(n/2,n*0.42,46*u,0,6.283);g.fill();
      g.fillStyle='#6b3f17';g.beginPath();g.ellipse(n/2-46*u,n*0.4,14*u,30*u,0.3,0,6.283);g.ellipse(n/2+46*u,n*0.4,14*u,30*u,-0.3,0,6.283);g.fill();
      g.fillStyle='#fff';g.beginPath();g.arc(n/2-16*u,n*0.38,10*u,0,6.283);g.arc(n/2+16*u,n*0.38,10*u,0,6.283);g.fill();
      g.fillStyle='#111';g.beginPath();g.arc(n/2-16*u,n*0.375,5*u,0,6.283);g.arc(n/2+16*u,n*0.375,5*u,0,6.283);g.arc(n/2,n*0.5,9*u,0,6.283);g.fill();
      return c.toDataURL('image/png')};
    const i192=mk(192),i512=mk(512);
    const l=document.createElement('link');l.rel='apple-touch-icon';l.href=i192;document.head.appendChild(l);
    const l2=document.createElement('link');l2.rel='icon';l2.href=i192;document.head.appendChild(l2);
    const man={name:'Super Dogs Rush',short_name:'Dogs Rush',start_url:location.href.split('#')[0],display:'fullscreen',orientation:'portrait',background_color:'#071c0f',theme_color:'#0b3d1e',
      icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any'}]};
    const m=document.createElement('link');m.rel='manifest';m.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.appendChild(m);
  }catch(e){}

setupPWA();
try{if(navigator.serviceWorker&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}

})();
