<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dogs Rush">
<meta name="theme-color" content="#0b3d1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Super Dogs Rush v19</title>
<style>
html,body{margin:0;height:100%;background:#071c0f;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#sb{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86vw,340px);background:#0b3d1e;border:2px solid #ffcc00;border-radius:14px;padding:14px;display:none;z-index:5;font:600 14px -apple-system,Helvetica,Arial,sans-serif;color:#fff;text-align:center;-webkit-user-select:text;user-select:text}
#sb textarea{width:100%;box-sizing:border-box;height:80px;font:14px monospace;border-radius:8px;border:0;padding:6px;-webkit-user-select:text;user-select:text;touch-action:auto}
#sb button{margin-top:10px;font:800 18px -apple-system,Helvetica,Arial,sans-serif;padding:10px 28px;border-radius:12px;border:0;background:#ffcc00;color:#2a1a00}
#live{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
</style>
</head>
<body>
<canvas id="c" role="application" aria-label="Super Dogs Rush game canvas"></canvas>
<div id="sa"></div>
<div id="live" role="status" aria-live="polite"></div>
<div id="sb"><div id="sbm">Copy your score:</div><textarea id="sbt" readonly></textarea><br><button id="sbc" type="button">CLOSE</button></div>
<script>
(function(){
'use strict';
const W=360,H=640;                 // logical game size
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,ox=0,oy=0,dpr=1,safeT=0,safeB=0,safeL=0,safeR=0;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);
  const w=window.innerWidth,h=window.innerHeight;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  scale=Math.min(w/W,h/H);ox=(w-W*scale)/2;oy=(h-H*scale)/2;
  // v12: safe-area insets (notch / home bar / rounded corners) in logical units, only the part that overlaps the game area
  let it=0,ib=0,il=0,ir=0;
  try{const cs=window.getComputedStyle(document.getElementById('sa'));
    it=parseFloat(cs.paddingTop)||0;ib=parseFloat(cs.paddingBottom)||0;il=parseFloat(cs.paddingLeft)||0;ir=parseFloat(cs.paddingRight)||0}catch(e){}
  safeT=Math.max(0,(it-oy)/scale);safeB=Math.max(0,(ib-oy)/scale);safeL=Math.max(0,(il-ox)/scale);safeR=Math.max(0,(ir-ox)/scale);
  if(!(safeT>=0&&safeT<80))safeT=0;if(!(safeB>=0&&safeB<80))safeB=0;if(!(safeL>=0&&safeL<80))safeL=0;if(!(safeR>=0&&safeR<80))safeR=0;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));
resize();

// ---------- storage ----------
const liveEl=document.getElementById('live');function say(m){try{liveEl.textContent=m}catch(e){}}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
let SET=Object.assign({music:1,shake:1,haptics:1,rm:0,vol:7,cb:0,big:0,left:0,sens:3,hc:0,mvol:7,diff:1,pob:1,fx:1},(function(){try{return JSON.parse(localStorage.getItem('sdr_set'))||{}}catch(e){return{}}})());
SET.sens=Math.max(1,Math.min(5,Math.round(+SET.sens)||3));SET.vol=Math.max(0,Math.min(10,Math.round(+SET.vol)||0));SET.mvol=Math.max(0,Math.min(10,Math.round(+SET.mvol)||0));SET.hc=SET.hc?1:0;SET.pob=SET.pob===0||SET.pob==="0"?0:1;SET.diff=(+SET.diff===0||+SET.diff===2)?+SET.diff:1;
const SENS=[1.0,1.3,1.6,2.0,2.5];
function saveSet(){lsSet('sdr_set',JSON.stringify(SET))}
let bestN=parseInt(lsGet('sdr_best','0'),10)||0,bestH=parseInt(lsGet('sdr_best_h','0'),10)||0;
let best=bestN;   // v15: 'best' = best for the currently selected mode (Normal or Hard); Practice shows Normal
function syncBest(){best=SET.diff===2?bestH:bestN}
syncBest();
let totalCoins=parseInt(lsGet('sdr_total','0'),10)||0;   // lifetime fake coins -> unlocks skins
let skinIdx=parseInt(lsGet('sdr_skin','0'),10)||0;
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const dayKey=todayKey();
// v10: prune daily tables from previous days
try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&(k.indexOf('sdr_dlb_')===0&&k!=='sdr_dlb_'+dayKey||k.indexOf('sdr_ghost_')===0&&k!=='sdr_ghost_'+dayKey))localStorage.removeItem(k)}}catch(e){}
let dailyBest=parseInt(lsGet('sdr_daily_'+dayKey,'0'),10)||0;
let dStreak=parseInt(lsGet('sdr_dstreak','0'),10)||0,dLast=lsGet('sdr_dlast','');
function dayKeyOff(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
if(dLast!==dayKey&&dLast!==dayKeyOff(-1))dStreak=0;   // streak lapsed
let shareMsg='',shareT=0;
function vib(ms){try{if(navigator.vibrate&&SET.haptics&&!reduceMotion)navigator.vibrate(ms)}catch(e){}}
function lsJSON(k,d){try{const v=JSON.parse(lsGet(k,''));return v==null?d:v}catch(e){return d}}
let lb=lsJSON('sdr_lb',[]);if(!Array.isArray(lb))lb=[];
let lbN=lsJSON('sdr_lb_n',[]),lbH=lsJSON('sdr_lb_h',[]);if(!Array.isArray(lbN))lbN=[];if(!Array.isArray(lbH))lbH=[];   // v17: per-mode top-5 (Normal / Hard)
let lbRankM=-1;
let stats=Object.assign({runs:0,bestScore:0,bestYards:0,bestCoins:0,totalYards:0,walls:0},lsJSON('sdr_stats',{}));
let deaths=lsJSON('sdr_deaths',[]);if(!Array.isArray(deaths))deaths=[];
let lbRank=-1,lbMode=0;   // v17 lbMode 0=all runs, 1=today's daily, 2=Normal, 3=Hard
let dlb=lsJSON('sdr_dlb_'+dayKey,[]);if(!Array.isArray(dlb))dlb=[];
let resetArm=0;
function resetStats(){
  if(!resetArm){resetArm=1;setTimeout(()=>{resetArm=0},3000);sfx.click();say('Tap RESET again to erase scores and stats');return}
  resetArm=0;best=0;bestN=0;bestH=0;stats={runs:0,bestScore:0,bestYards:0,bestCoins:0,totalYards:0,walls:0};lb=[];lbN=[];lbH=[];dlb=[];deaths=[];lbRank=-1;lbRankM=-1;
  ['sdr_best','sdr_best_h','sdr_stats','sdr_lb','sdr_lb_n','sdr_lb_h','sdr_deaths','sdr_dlb_'+dayKey].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  sfx.click();say('Scores and stats erased');
}
function recordRun(s,yards,killer){
  stats.runs++;stats.totalYards+=yards;
  if(s>stats.bestScore)stats.bestScore=s;if(yards>stats.bestYards)stats.bestYards=yards;if(coins>stats.bestCoins)stats.bestCoins=coins;
  stats.walls+=wallsCleared;
  lsSet('sdr_stats',JSON.stringify(stats));
  const e={s,y:yards,c:coins,d:daily?dayKey:'',n:Date.now()};
  lb.push(e);lb.sort((a,b)=>b.s-a.s||a.n-b.n);lbRank=lb.indexOf(e);lb=lb.slice(0,5);if(lbRank>4)lbRank=-1;
  lsSet('sdr_lb',JSON.stringify(lb));
  lbRankM=-1;if(!daily&&runDiff!==0){const A=runDiff===2?lbH:lbN;A.push(e);A.sort((a,b)=>b.s-a.s||a.n-b.n);lbRankM=A.indexOf(e);const B=A.slice(0,5);if(lbRankM>4)lbRankM=-1;if(runDiff===2)lbH=B;else lbN=B;lsSet(runDiff===2?'sdr_lb_h':'sdr_lb_n',JSON.stringify(B))}
  if(daily){dlb.push(e);dlb.sort((a,b)=>b.s-a.s||a.n-b.n);dlb=dlb.slice(0,5);lsSet('sdr_dlb_'+dayKey,JSON.stringify(dlb));if(lbRank<0)lbRank=-1}
  if(daily||runDiff===1)deaths.push({y:yards,k:killer,t:Math.round(t*10)/10,s,m:daily?1:0,n:Date.now()});   // for difficulty tuning (last 200 runs)
  if(deaths.length>200)deaths=deaths.slice(-200);
  lsSet('sdr_deaths',JSON.stringify(deaths));
}
function saveBest(){lsSet('sdr_best',bestN);lsSet('sdr_best_h',bestH)}
const SKINS=[
  {name:'Classic',jersey:'#ffcc00',num:'#1b3a8c',need:0,fx:'bars'},
  {name:'Night Owl',jersey:'#7e57c2',num:'#ffffff',need:100,fx:'stars'},
  {name:'Mint',jersey:'#26c6a0',num:'#06352b',need:300,fx:'rings'},
  {name:'Hot Pink',jersey:'#ff4081',num:'#ffffff',need:600,fx:'hearts'},
  {name:'Ice',jersey:'#e3f2fd',num:'#0d47a1',need:1000,fx:'flakes'},
  {name:'Gold Legend',jersey:'#ffd700',num:'#5d4037',need:2000,fx:'comet'}
];
if(skinIdx>=SKINS.length||SKINS[skinIdx].need>totalCoins)skinIdx=0;
// seeded RNG (daily challenge uses a date seed so everyone gets the same field)
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedFromKey(k){let h=2166136261;for(let i=0;i<k.length;i++){h^=k.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
let rng=Math.random,daily=false,acc=0;
const osRM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let reduceMotion=osRM||!!SET.rm;   // v9: OS setting OR in-game override

// ---------- audio (muted by default) ----------
let synergy=0;
let muted=lsGet('sdr_muted','1')!=='0',actx=null,master=null,mgain=null;
function volGain(){const v=Math.max(0,Math.min(10,+SET.vol));return isFinite(v)?(v/10)*(v/10):0.49}   // v10 master volume (0-10, squared curve)
function mvolGain(){const v=Math.max(0,Math.min(10,+SET.mvol));return isFinite(v)?(v/10)*(v/10):0.49}   // v13 separate music volume
function applyVol(){if(master)master.gain.value=volGain();if(mgain)mgain.gain.value=mvolGain()}
function initAudio(){
  if(actx){if(actx.state==='suspended')actx.resume();return}
  try{const A=window.AudioContext||window.webkitAudioContext;if(A){actx=new A();master=actx.createGain();master.gain.value=volGain();master.connect(actx.destination);mgain=actx.createGain();mgain.gain.value=mvolGain();mgain.connect(master)}}catch(e){}
}
function tone(f,d,type,vol,slide){
  if(muted||!actx)return;
  const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(vol||0.08,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(master||actx.destination);o.start(t);o.stop(t+d+0.02);
}
const sfx={
  coin(){const m=[1,1.06,1.12,1.19,1.26,1.5][skinIdx]||1,w=['square','square','triangle','sine','triangle','sawtooth'][skinIdx]||'square';const cm=1+0.06*(Math.min(5,combo)-1);tone(880*m*cm,0.08,w,0.06);setTimeout(()=>tone(1320*m*cm,0.1,w,0.06),60)},
  shield(){tone(400,0.25,'sine',0.1,2.5)},
  graze(){tone(1320+Math.min(6,streak%5)*90,0.05,'triangle',0.04)},
  curse(){tone(220,0.35,'sawtooth',0.09,0.5);setTimeout(()=>tone(165,0.3,'square',0.07,0.6),120)},
  block(){tone(300,0.2,'sawtooth',0.08,0.4)},
  hit(){tone(220,0.5,'sawtooth',0.12,0.2)},
  click(){tone(600,0.05,'square',0.05)},
  juke(){tone(500,0.1,'triangle',0.06,1.6)},
  power(){tone(500,0.3,'triangle',0.09,2.2)},
  dash(){const m=[1,0.9,1.2,1.5,1.8,0.75][skinIdx]||1;tone(200*m,0.35,['sawtooth','sawtooth','sine','triangle','sine','square'][skinIdx]||'sawtooth',0.1,4)},
  smash(){tone(160,0.12,'square',0.09,0.5)},
  ready(){tone(700,0.1,'triangle',0.08);setTimeout(()=>tone(1050,0.15,'triangle',0.08),90)},
  tick(){tone(520,0.06,'sine',0.07)},
  warn(){tone(900,0.12,'square',0.05,0.5);setTimeout(()=>tone(900,0.12,'square',0.05,0.5),140)}
};

// ---------- procedural music loop (v6; follows the mute toggle, plays only in a run) ----------
const music={on:false,next:0,step:0,timer:0,
  // v7: 4-chord progression (Am F C G), 4 lead shapes rotating every 4 bars, kick joins later in the run
  chords:[[110,131,165],[87.3,110,131],[130.8,164.8,196],[98,123.5,147]],
  shapes:[[0,1,0,2,0,3,2,0],[3,0,2,0,1,0,2,3],[0,2,0,3,0,2,0,1],[1,0,3,0,2,0,3,2]],
  note(f,d,type,vol,at){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(0.0001,at+d);o.connect(g);g.connect(mgain||master||actx.destination);o.start(at);o.stop(at+d+0.02)},
  kick(at){const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.setValueAtTime(140,at);o.frequency.exponentialRampToValueAtTime(45,at+0.12);
    g.gain.setValueAtTime(0.09,at);g.gain.exponentialRampToValueAtTime(0.0001,at+0.14);o.connect(g);g.connect(mgain||master||actx.destination);o.start(at);o.stop(at+0.16)},
  tick(){
    if(!actx||muted||!SET.music||state!=='play'||countdown>0||actx.state!=='running'){this.next=0;return}
    const bpm=112+Math.min(40,t*0.35),sp=60/bpm/2,now=actx.currentTime;
    if(!this.next||this.next<now-0.3)this.next=now+0.05;
    while(this.next<now+0.25){
      const i=this.step++,at=this.next,bar=i>>3,pos=i&7,ch=this.chords[bar&3],sh=this.shapes[(bar>>2)&3];
      if(!(pos&1))this.note(ch[0]*(pos===4?1.5:1),sp*1.6,'triangle',0.07,at);
      const ti=sh[pos];if(pos&1||ti){const f=ch[ti%3]*(ti>2?4:2)*((bar>>4)&1&&pos===7?2:1);if(!(pos===0&&!ti))this.note(f,sp*0.8,'square',0.025,at)}
      if(i%4===2)this.note(3000,0.03,'square',0.012,at);
      if(t>40&&pos%4===0)this.kick(at);
      this.next+=sp;
    }
  }};
setInterval(()=>{try{music.tick()}catch(e){}},80);

// ---------- game state ----------
let dbg=location.hash==='#debug'||lsGet('sdr_dbg','0')==='1',dbgTaps=0,fps=0,fpsN=0,fpsT=0,steps=0,ialpha=1,pscroll=0;
let state='title';           // title | help | skins | stats | settings | play | pause | over
let curse=0,curseT0=0,cursed=0,hitstop=0,trailT=0,dbl=0,ghostRec=[],ghostPlay=null,adapt=1,bombs=0,bossT=0,t=0,dist=0,coins=0,bonus=0,combo=1,comboT=0,magnet=0,slow=0,gameOverT=0,unlockMsg='',runPrevTotal=0,speed=0,spawnT=0,coinT=0,shake=0,flash=0,newBest=false,streak=0,wallsCleared=0,wallT=0,defHold=0,killer='',dashCharge=0,dashT=0,dashes=0,countdown=0;
const player={x:W/2,y:H*0.78,r:14,tx:W/2,shield:0,inv:0,run:0,lean:0};
let luckyShield=false;
let pending=[],warns=[],walls=[];
let defs=[],pickups=[],parts=[],texts=[];
const keys={};
let scroll=0;

// v11: mild adaptive easing from the local death log (non-daily only). Heuristic, not a fit: if the median of the last 20 runs ends before 25 s, early spawn intervals stretch by up to 25 %, fading out by 2 min.
function calcAdapt(){const ds=deaths.filter(e=>e&&!e.m&&isFinite(e.t)).slice(-20).map(e=>e.t).sort((a,b)=>a-b);if(ds.length<5)return 1;const med=ds[ds.length>>1];return med<25?1+0.25*(1-med/25):1}
function reset(){
  dragId=null;
  synergy=0;music.step=0;music.next=0;t=0;dist=0;coins=0;bonus=0;combo=1;comboT=0;magnet=0;slow=0;dbl=0;curse=0;hitstop=0;cursed=0;ghostRec=[];ghostPlay=daily?lsJSON('sdr_ghost_'+dayKey,null):null;if(!Array.isArray(ghostPlay)||!ghostPlay.length)ghostPlay=null;adapt=daily?1:calcAdapt();gameOverT=0;unlockMsg='';
  speed=210*DIFF[runDiff].spd*(dmod()===2?1.06:1);spawnT=1.6;coinT=0.5;shake=0;flash=0;newBest=false;streak=0;wallsCleared=0;wallT=30;bossT=45;defHold=0;killer='';dashCharge=0;dashT=0;dashes=0;countdown=0;lbRank=-1;lbRankM=-1;acc=0;
  rng=daily?mulberry32(seedFromKey(dayKey)):Math.random;
  player.x=player.tx=W/2;player.shield=dmod()===2?1:0;player.inv=0;
  defs=[];pickups=[];parts=[];texts=[];pending=[];warns=[];walls=[];shareMsg='';shareT=0;
}
// v17: daily modifier, picked from the date (same for everyone, deterministic). 0 coin rain, 1 diver day, 2 head start
const DMODS=[{n:'COIN RAIN',d:'Twice as many coin lines'},{n:'DIVER DAY',d:'Divers from 15 s, more often'},{n:'HEAD START',d:'Start with a shield, 6% faster'}];
const dailyMod=seedFromKey(dayKey+'#mod')%DMODS.length;
function dmod(){return daily?dailyMod:-1}
function earlyDeaths(){const d=deaths.filter(e=>e&&!e.m&&isFinite(e.t)).slice(-2);return d.length===2&&d.every(e=>e.t<20)}   // v16: two quick deaths in a row
function bv(v){return (dbl>0?v*2:v)*(curse>0?3:1)}
function score(){return Math.floor(dist/10)+bonus}
function startGame(isDaily){daily=!!isDaily;runDiff=daily?1:SET.diff;reset();luckyShield=false;if(!daily&&runDiff===1&&earlyDeaths()){player.shield=1;luckyShield=true;floatText(W/2,H*0.6,'Lucky shield!','#7fd6ff')}runPrevTotal=totalCoins;state='play';sfx.click()}
function endGame(k){
  dragId=null;
  killer=k||'std';
  state='over';shake=reduceMotion?0.1:0.5;sfx.hit();say('Tackled. Score '+score());
  const s=score();
  vib([60,40,120]);
  if(daily){if(dLast!==dayKey){dStreak=(dLast===dayKeyOff(-1)?dStreak:0)+1;dLast=dayKey;lsSet('sdr_dstreak',dStreak);lsSet('sdr_dlast',dLast)}
    newBest=s>dailyBest&&s>0;if(newBest){dailyBest=s;lsSet('sdr_daily_'+dayKey,s);lsSet('sdr_ghost_'+dayKey,JSON.stringify(ghostRec))}}
  else if(runDiff!==0){const cur=runDiff===2?bestH:bestN;newBest=s>cur&&s>0;if(newBest){if(runDiff===2)bestH=s;else bestN=s;saveBest();syncBest()}}
  else newBest=false;
  if(daily||runDiff!==0)recordRun(s,Math.floor(dist/10),killer);
  totalCoins+=coins;lsSet('sdr_total',totalCoins);
  const nu=SKINS.filter(k=>k.need>runPrevTotal&&k.need<=totalCoins);
  unlockMsg=nu.length?'Skin unlocked: '+nu[nu.length-1].name+'!':'';
  burst(player.x,player.y,24,'#c68642');
}
function addCharge(v){if(dashT>0)return;const was=dashCharge>=1;dashCharge=Math.min(1,dashCharge+v);if(!was&&dashCharge>=1){sfx.ready();floatText(player.x,player.y-46,'DASH READY!','#80ffea')}}
function doDash(){if(state!=='play'||dashCharge<1||dashT>0||countdown>0)return;dashCharge=0;ring(player.x,player.y,'#80ffea');dashT=0.8;dashes++;sfx.dash();vib(30);shake=reduceMotion?0:0.15}
function resumeGame(){dragId=null;state='play';countdown=1.5;acc=0;last=0}
function pause(){if(state==='play'){state='pause';dragId=null}}

function burst(x,y,n,col){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=40+Math.random()*180;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.5+Math.random()*0.4,c:col})}
}
function ring(x,y,col){if(reduceMotion)return;for(let i=0;i<16;i++){const a=i/16*6.283;parts.push({x,y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,life:0.35,c:col})}}
function floatText(x,y,s,c){texts.push({x,y,s,c,life:0.9})}

// ---------- spawning / difficulty ----------
// v14 difficulty select (0 Practice, 1 Normal, 2 Hard). Daily is always Normal. Practice runs are not saved to scores/stats/adaptive log; Hard is saved but kept out of the adaptive-easing log.
const DIFF=[{n:'PRACTICE',spd:0.85,sp:1.3},{n:'NORMAL',spd:1,sp:1},{n:'HARD',spd:1.1,sp:0.85}];
let runDiff=1;
function level(){return Math.min(1,t/120)}   // 0..1 over two minutes
// v7 spawn curve: smoothstep from 1.15 s (start) to 0.42 s (plateau at 2 min); replaces v6's kinked formula. NOT tuned on real death data.
const SPAWN={start:1.15,end:0.42};
function spawnInterval(){const L=level(),e=L*L*(3-2*L);return (SPAWN.start+(SPAWN.end-SPAWN.start)*e)*(1+(adapt-1)*(1-L))*DIFF[runDiff].sp*(curse>0?0.6:1)}
function spawnDefender(){
  const L=level(),r=rng();
  let type='std';
  if(t>14&&r<0.22+0.2*L)type='chaser';
  else if(t>30&&r<0.45+0.2*L)type='sprint';
  else if(t>20&&r<0.62+0.1*L)type='zig';
  // fairness: avoid stacking a wall - keep >=60px horizontal gap from defenders still near the top
  let x=24+rng()*(W-48);
  for(let k=0;k<8;k++){
    if(!defs.some(d=>d.y<110&&Math.abs(d.x-x)<60))break;
    x=24+rng()*(W-48);
  }
  if(t>(dmod()===1?15:40)&&!defs.some(q=>q.type==='dive')&&!pending.some(q=>q.d.type==='dive')&&r>(dmod()===1?0.75:0.9)){   // v16: telegraphed diver
    const dd={x:Math.max(30,Math.min(W-30,x)),y:-30,r:13,type:'dive',vx:0,ph:rng()*6,passed:false,x0:x};
    pending.push({d:dd,delay:0.9});warns.push({x:dd.x,life:0.9,dive:true});sfx.warn();return}
  if(t>45&&type==='std'&&r>0.80&&r<0.9){   // v19: Roller - telegraphed log that drifts sideways while it falls, bouncing off the walls
    const dir=rng()<0.5?-1:1,rx=dir>0?30:W-30;
    pending.push({d:{x:rx,y:-30,r:14,type:'roll',vx:dir*95,ph:rng()*6,passed:false,x0:rx},delay:0.8});warns.push({x:rx,life:0.8});return}
  const d={x,y:-30,r:type==='sprint'?13:15,type,vx:0,ph:rng()*6,passed:false,x0:x};
  if(type==='sprint'){pending.push({d,delay:0.7});warns.push({x,life:0.7})}   // telegraphed: arrives after a warning
  else defs.push(d);
}
function spawnBoss(){   // v9: from 90 s the boss is armored (needs 2 dash hits to smash)
  const arm=t>=90?1:0;   // v8: big slow linebacker, telegraphed 1 s; smash with dash (+100 x combo) or shield; dodge sideways
  const x=60+rng()*(W-120);
  pending.push({d:{x,y:-40,r:26,type:'boss',arm,vx:0,ph:rng()*6,passed:false,x0:x},delay:1.0});warns.push({x,life:1.0,boss:true});defHold=1.5;
}
function spawnWall(){
  const L=level(),pil=t>60&&rng()<0.45,gw=pil?Math.max(130,160-30*L):Math.max(98,132-34*L);          // gap width always >= 98 px (dog is ~28 px wide)
  const c0=gw/2+10+rng()*(W-gw-20);
  walls.push({y:-20,h:22,gw,c0,amp:Math.min(60,c0-gw/2-6,W-c0-gw/2-6,25+35*L),ph:rng()*6.283,w:0.7+0.5*L,gc:c0,pil,passed:false,broken:false});
  defHold=1.7;                                       // no defenders spawn right behind/inside the wall
}
function spawnPickup(){
  const x=30+rng()*(W-60),q=rng();
  if(q<0.10&&player.shield<=0)pickups.push({x,y:-20,type:'shield',r:13});
  else if(q<0.16)pickups.push({x,y:-20,type:'magnet',r:13});
  else if(q<0.22&&t>15)pickups.push({x,y:-20,type:'slow',r:13});
  else if(q<0.27&&t>10)pickups.push({x,y:-20,type:'x2',r:13});
  else if(q<0.31&&t>25)pickups.push({x,y:-20,type:'bomb',r:13});
  else if(q<0.35&&t>20&&curse<=0)pickups.push({x,y:-20,type:'curse',r:13});   // v18 risk/reward
  else{ // a short line of coins
    const n=3+Math.floor(rng()*3),dx=(rng()-0.5)*14;
    for(let i=0;i<n;i++)pickups.push({x:Math.max(20,Math.min(W-20,x+dx*i)),y:-20-i*34,type:'coin',r:9});
  }
}

// ---------- update ----------
function snap(){
  player.px=player.x;pscroll=scroll;
  for(const a of [defs,pickups,walls,parts])for(const o of a){o.px=o.x;o.py=o.y;if(o.gc!==undefined)o.pgc=o.gc}
}
function update(dt){
  snap();
  if(countdown>0){const c0=Math.ceil(countdown*2);countdown-=dt;if(Math.ceil(countdown*2)!==c0&&countdown>0&&c0%2===0)sfx.tick();return}
  if(hitstop>0){hitstop-=dt;return}
  t+=dt;
  if(curse>0){curse-=dt;if(curse<=0){curse=0;bonus+=250;addCharge(1);sfx.power();floatText(player.x,player.y-40,'CURSE SURVIVED +250','#e040fb');ring(player.x,player.y,'#e040fb')}}
  if(SET.fx&&!reduceMotion&&(curse>0||dashT>0)){trailT-=dt;if(trailT<=0){trailT=0.03;parts.push({x:player.x+(Math.random()-0.5)*10,y:player.y+14,vx:(Math.random()-0.5)*30,vy:90,life:0.35,c:curse>0?'#e040fb':'#80ffea'})}}
  if(dashT>0){dashT-=dt;player.inv=Math.max(player.inv,0.05)}
  const L=level();
  speed=(210+270*L+Math.min(60,t*0.3))*DIFF[runDiff].spd*(dmod()===2?1.06:1);
  if(slow>0){slow-=dt}
  if(magnet>0)magnet-=dt;
  if(dbl>0)dbl-=dt;
  {const gi=Math.floor(t/0.1);if(ghostRec.length<=gi&&ghostRec.length<4000)ghostRec.push(Math.round(player.x))}
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=1}
  const wd=slow>0?dt*0.6:dt;      // world time (slow-mo affects defenders/scroll, not the dog)
  scroll=(scroll+speed*wd)%80;
  dist+=speed*wd*0.5*(dashT>0?1.6:1);
  // input -> target
  let kx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);if(!kx)kx=gpAx;
  if(kx)player.tx+=kx*430*dt;
  player.tx=Math.max(player.r+4,Math.min(W-player.r-4,player.tx));
  const prev=player.x;
  player.x+=(player.tx-player.x)*Math.min(1,dt*14);
  player.lean+=((player.x-prev)/Math.max(dt,0.001)/300-player.lean)*Math.min(1,dt*10);
  player.run+=dt*speed*0.03;
  if(player.inv>0)player.inv-=dt;

  if(defHold>0)defHold-=wd;
  wallT-=wd;
  if(wallT<=0){
    if(t>35&&!pending.length&&!defs.some(d=>d.y<140)&&!walls.length){spawnWall();wallT=14+rng()*8}
    else wallT=0.5;
  }
  bossT-=wd;
  if(bossT<=0){
    if(t>=45&&!walls.length&&!pending.length&&!defs.some(d=>d.type==='boss'||d.y<150)){spawnBoss();bossT=26+rng()*10}else bossT=0.5;
  }
  spawnT-=wd;
  if(spawnT<=0&&defHold>0)spawnT=0.05;
  else if(spawnT<=0){
    spawnDefender();
    if(t>30&&rng()<0.25*L+0.06)spawnDefender();
    spawnT=spawnInterval()*(0.7+rng()*0.6);
  }
  coinT-=wd;
  if(coinT<=0){spawnPickup();coinT=(1.4+rng()*1.2)*(dmod()===0?0.5:1)}

  for(const w of warns)w.life-=dt;
  warns=warns.filter(w=>w.life>0);
  for(const q of pending)q.delay-=wd;
  for(const q of pending)if(q.delay<=0)defs.push(q.d);
  pending=pending.filter(q=>q.delay>0);
  if(Math.random()<dt*40){const sk=SKINS[skinIdx];
    parts.push({x:player.x+(Math.random()-0.5)*10,y:player.y+12,vx:(Math.random()-0.5)*20,vy:60+Math.random()*40,life:0.35,c:skinIdx?sk.jersey:'rgba(255,255,255,.6)'})}
  for(const d of defs){
    if(d.type==='zig'){d.x=Math.max(18,Math.min(W-18,d.x0+Math.sin(d.ph*0.45)*55))}
    if(d.type==='roll'){d.x+=d.vx*wd;if(d.x<22){d.x=22;d.vx=Math.abs(d.vx)}else if(d.x>W-22){d.x=W-22;d.vx=-Math.abs(d.vx)}}
    d.y+=speed*(d.type==='roll'?0.7:d.type==='dive'?1.9:d.type==='sprint'?1.35:d.type==='boss'?0.62:0.85)*wd;
    d.ph+=dt*8;
    if((d.type==='chaser'||d.type==='boss')&&d.y>0&&d.y<player.y-40){
      const dx=player.x-d.x;d.x+=Math.sign(dx)*Math.min(Math.abs(dx),(d.type==='boss'?45+30*L:60+90*L)*wd);
    }
    if(!d.passed&&d.y>player.y+d.r+player.r){d.passed=true;
      if(Math.abs(d.x-player.x)<d.r+player.r+26){streak++;if(streak%5!==0){sfx.graze();if(SET.fx&&!reduceMotion)burst(player.x+(d.x<player.x?-12:12),player.y,3,'#fff59d')}
        if(streak%5===0){const v=10*combo;coins++;bonus+=bv(v);comboT=3;addCharge(0.25);floatText(player.x,player.y-30,'Close call! +'+v,'#ffe066');sfx.juke()}}}
    const dx=d.x-player.x,dy=d.y-player.y,rr=d.r+player.r-3;
    if(dashT>0&&d.arm&&d.armT>0)d.armT-=wd;
    if(dashT>0&&d.arm&&!(d.armT>0)&&dx*dx+dy*dy<(rr+10)*(rr+10)){d.arm=0;d.armT=0;const v=50*combo;bonus+=bv(v);burst(d.x,d.y,16,'#b0bec5');floatText(d.x,d.y-40,'ARMOR BREAK +'+v,'#b0bec5');sfx.smash();vib(20);shake=reduceMotion?0:0.2;d.armT=0.4;d.y-=30;d.hitgrace=0.4;continue}
    if(dashT>0&&d.hitgrace>0){d.hitgrace-=wd;continue}
    if(dashT>0&&dx*dx+dy*dy<(rr+10)*(rr+10)){const v=(d.type==='boss'?100:25)*combo;bonus+=bv(v);d.y=H+100;burst(d.x,d.y>H?player.y:d.y,d.type==='boss'?30:14,'#80ffea');floatText(d.x,player.y-30,(d.type==='boss'?'BOSS SMASH! +':'SMASH! +')+v,'#80ffea');sfx.smash();vib(20);continue}
    if(dx*dx+dy*dy<rr*rr&&player.inv<=0){
      if(player.shield>0){player.shield=0;player.inv=1;shake=reduceMotion?0.05:0.25;sfx.block();vib(40);
        burst(d.x,d.y,16,'#7fd6ff');d.y=H+100;floatText(player.x,player.y-30,'Blocked!','#7fd6ff')}
      else{endGame(d.type);return}
    }
  }
  for(const p of pickups){
    p.y+=speed*0.85*wd;
    if(magnet>0&&p.type==='coin'){const mx=player.x-p.x,my=player.y-p.y,md=Math.hypot(mx,my);
      if(md<130&&md>1){const k=Math.min(1,320*dt/md);p.x+=mx*k;p.y+=my*k}}
    const dx=p.x-player.x,dy=p.y-player.y,rr=p.r+player.r+4;
    if(dx*dx+dy*dy<rr*rr){
      p.dead=true;
      if(p.type==='coin'){
        coins++;comboT=3;addCharge(0.07);
        if(coins%4===0&&combo<5){combo++;vib(15);ring(p.x,p.y,'#ff9bd0');floatText(p.x,p.y-18,'COMBO x'+combo,'#ff9bd0')}
        const v=10*combo;bonus+=bv(v);sfx.coin();floatText(p.x,p.y,'+'+v,'#ffd54a');burst(p.x,p.y,5,'#ffd54a');
        if(magnet>0&&dbl>0){addCharge(0.04);synergy++;if(synergy%6===1)floatText(p.x,p.y-30,'x2+MAGNET','#ffe066')}}   // v13 synergy: bonus dash charge
      else if(p.type==='curse'){curse=10;cursed++;hitstop=SET.fx&&!reduceMotion?0.08:0;sfx.curse();ring(p.x,p.y,'#e040fb');floatText(p.x,p.y,'CURSED! x3 SCORE','#e040fb');say('Cursed coin: triple score for 10 seconds, more defenders')}
      else if(p.type==='magnet'){magnet=8;sfx.power();ring(p.x,p.y,'#ff8a80');floatText(p.x,p.y,'Magnet!','#ff8a80')}
      else if(p.type==='x2'){dbl=8;sfx.power();ring(p.x,p.y,'#ffe066');floatText(p.x,p.y,'DOUBLE POINTS!','#ffe066')}
      else if(p.type==='bomb'){let n=0;for(const d of defs){if(d.type!=='boss'&&d.y>-20&&d.y<H){n++;bonus+=bv(10*combo);burst(d.x,d.y,8,'#ff9800');d.y=H+100}}bombs++;if(SET.fx&&!reduceMotion)hitstop=0.06;ring(p.x,p.y,'#ff9800');shake=reduceMotion?0.05:0.3;sfx.smash();vib(30);floatText(p.x,p.y,'BOMB! x'+n,'#ff9800')}
      else if(p.type==='slow'){slow=5;sfx.power();ring(p.x,p.y,'#b39ddb');floatText(p.x,p.y,'Slow-mo!','#b39ddb')}
      else{player.shield=1;sfx.shield();ring(p.x,p.y,'#7fd6ff');floatText(p.x,p.y,'Shield!','#7fd6ff')}
    }
  }
  for(const w of walls){
    w.y+=speed*0.85*wd;w.ph+=dt*w.w;
    w.gc=w.c0+Math.sin(w.ph)*w.amp;
    const gl=w.gc-w.gw/2,gr=w.gc+w.gw/2;
    if(!w.passed&&w.y>player.y+w.h/2+player.r){w.passed=true;if(!w.broken){wallsCleared++;bonus+=bv(20*combo);addCharge(0.2);floatText(player.x,player.y-30,'Wall cleared! +'+20*combo,'#ffe066');sfx.juke()}}
    if(Math.abs(w.y-player.y)<w.h/2+player.r-3&&player.inv<=0&&!w.broken&&dashT<=0&&(player.x-player.r+3<gl||player.x+player.r-3>gr||(w.pil&&Math.abs(player.x-w.gc)<15+player.r-3))){
      if(player.shield>0){player.shield=0;player.inv=1;w.broken=true;shake=reduceMotion?0.05:0.25;sfx.block();vib(40);
        burst(player.x,w.y,16,'#7fd6ff');floatText(player.x,player.y-30,'Blocked!','#7fd6ff')}
      else{endGame('wall');return}
    }
  }
  walls=walls.filter(w=>w.y<H+40);
  defs=defs.filter(d=>d.y<H+60);
  pickups=pickups.filter(p=>!p.dead&&p.y<H+40);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
  parts=parts.filter(p=>p.life>0);
  for(const q of texts){q.y-=40*dt;q.life-=dt}
  texts=texts.filter(q=>q.life>0);
  if(shake>0)shake-=dt;
}
function updateIdle(dt){ // animate effects on non-play screens
  scroll=(scroll+60*dt)%80;
  if(state==='over')gameOverT+=dt;
  for(const q of texts){q.y-=40*dt;q.life-=dt}
  texts=texts.filter(q=>q.life>0);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
  parts=parts.filter(p=>p.life>0);
  if(shake>0)shake-=dt;
}

// ---------- drawing ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(s,x,y,size,col,align,weight){
  ctx.font=(weight||'800')+' '+size+'px -apple-system,Helvetica,Arial,sans-serif';
  ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(2,size/6);ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineJoin='round';
  ctx.strokeText(s,x,y);ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);
}
function drawField(){
  for(let i=-1;i<9;i++){
    ctx.fillStyle=(i&1)?'#1d7a3a':'#22883f';
    ctx.fillRect(0,i*80+scroll,W,80);
  }
  ctx.fillStyle='rgba(255,255,255,.55)';
  for(let i=-1;i<9;i++)ctx.fillRect(0,i*80+scroll-1,W,2);
  ctx.fillStyle='rgba(255,255,255,.35)';
  for(let i=-1;i<9;i++){ctx.fillRect(W*0.3,i*80+scroll+38,6,2);ctx.fillRect(W*0.7,i*80+scroll+38,6,2)}
  ctx.fillStyle='#fff';ctx.fillRect(0,0,4,H);ctx.fillRect(W-4,0,4,H);
}
function drawDog(x,y,lean,shield,inv,dead,skin){
  const sk=skin||SKINS[skinIdx];
  ctx.save();ctx.translate(x,y);ctx.rotate(lean*0.35);
  if(SET.hc&&!dead){ctx.strokeStyle='#000';ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,18,0,6.283);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,18,0,6.283);ctx.stroke();ctx.lineWidth=1}   // v13 high-contrast ring
  if(inv>0&&Math.floor(inv*20)%2)ctx.globalAlpha=0.4;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(3,6,16,10,0,0,6.283);ctx.fill();
  const sw=Math.sin(player.run)*5;
  ctx.fillStyle='#8d5a2b';
  ctx.beginPath();ctx.ellipse(-9,sw+4,4,7,0,0,6.283);ctx.fill();
  ctx.beginPath();ctx.ellipse(9,-sw+4,4,7,0,0,6.283);ctx.fill();
  ctx.fillStyle=sk.jersey; // jersey body
  rr(-12,-12,24,22,8);ctx.fill();
  ctx.fillStyle=sk.num;ctx.font='800 11px Helvetica,Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('1',0,0);
  ctx.fillStyle='#c68642';ctx.beginPath();ctx.arc(0,-14,11,0,6.283);ctx.fill(); // head
  ctx.fillStyle='#6b3f17'; // ears
  ctx.beginPath();ctx.ellipse(-11,-15,4,8,0.3,0,6.283);ctx.fill();
  ctx.beginPath();ctx.ellipse(11,-15,4,8,-0.3,0,6.283);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,-17,2.6,0,6.283);ctx.arc(4,-17,2.6,0,6.283);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-4,-18,1.3,0,6.283);ctx.arc(4,-18,1.3,0,6.283);ctx.fill();
  ctx.beginPath();ctx.arc(0,-11,2.6,0,6.283);ctx.fill(); // nose
  ctx.fillStyle='#8a5a2e'; // football
  ctx.beginPath();ctx.ellipse(13,-3,5,8,0.4,0,6.283);ctx.fill();
  ctx.restore();
  if(shield>0){ctx.strokeStyle='rgba(127,214,255,.9)';ctx.lineWidth=3;ctx.fillStyle='rgba(127,214,255,.18)';
    ctx.beginPath();ctx.arc(x,y-4,24,0,6.283);ctx.fill();ctx.stroke()}
}
function drawDashFx(fx,x,y){   // v7: per-skin dash effect (cosmetic only)
  const k=t*14;
  ctx.save();
  if(fx==='stars'){ctx.fillStyle='rgba(206,170,255,.85)';for(let i=0;i<7;i++){const yy=y+10+i*13,xx=x+Math.sin(k+i*1.7)*14,s=4-i*0.4;ctx.fillRect(xx-s/2,yy-s*1.5,s,s*3);ctx.fillRect(xx-s*1.5,yy-s/2,s*3,s)}}
  else if(fx==='rings'){ctx.lineWidth=3;for(let i=0;i<4;i++){const ph=((t*3+i*0.25)%1);ctx.strokeStyle='rgba(38,198,160,'+(0.7*(1-ph))+')';ctx.beginPath();ctx.ellipse(x,y+8+ph*50,10+ph*22,4+ph*8,0,0,6.283);ctx.stroke()}}
  else if(fx==='hearts'){ctx.fillStyle='rgba(255,64,129,.8)';for(let i=0;i<5;i++){const ph=((t*2.5+i*0.2)%1),xx=x+Math.sin(i*2.3+k*0.2)*14,yy=y+8+ph*60,s=7*(1-ph*0.6);ctx.beginPath();ctx.arc(xx-s/2,yy,s/2,0,6.283);ctx.arc(xx+s/2,yy,s/2,0,6.283);ctx.moveTo(xx-s,yy+s*0.2);ctx.lineTo(xx,yy+s*1.1);ctx.lineTo(xx+s,yy+s*0.2);ctx.fill()}}
  else if(fx==='flakes'){ctx.strokeStyle='rgba(227,242,253,.9)';ctx.lineWidth=2;for(let i=0;i<6;i++){const ph=((t*2+i*0.17)%1),xx=x+Math.sin(i*3.1)*16,yy=y+6+ph*64,s=5*(1-ph*0.5);ctx.beginPath();ctx.moveTo(xx-s,yy);ctx.lineTo(xx+s,yy);ctx.moveTo(xx,yy-s);ctx.lineTo(xx,yy+s);ctx.moveTo(xx-s*.7,yy-s*.7);ctx.lineTo(xx+s*.7,yy+s*.7);ctx.moveTo(xx-s*.7,yy+s*.7);ctx.lineTo(xx+s*.7,yy-s*.7);ctx.stroke()}}
  else if(fx==='comet'){const g=ctx.createLinearGradient(0,y,0,y+90);g.addColorStop(0,'rgba(255,215,0,.8)');g.addColorStop(1,'rgba(255,215,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-14,y);ctx.lineTo(x+14,y);ctx.lineTo(x+2,y+90);ctx.lineTo(x-2,y+90);ctx.closePath();ctx.fill();

    text(r[1]?'ON':'OFF',r[1]?W-88:W-76,y+19,10,'#fff','center','800')});

  text('DASH button side',44,y+RH/2+1,15,'#fff','left','700');

  const bar=(yy,label,val,max,idd)=>{frame(yy);text(label,44,yy+RH/2+1,15,'#fff','left','700');
    buttons.push({id:'set_'+idd+'d',x:128,y:yy,w:46,h:RH});buttons.push({id:'set_'+idd+'u',x:W-84,y:yy,w:54,h:RH});
    text('−',151,yy+RH/2,24,'#fff','center','800');text('+',W-57,yy+RH/2,24,'#fff','center','800');
    const bw=max>5?8:16,gap=max>5?2:2,x0=182;for(let k=0;k<max;k++){ctx.fillStyle=k<val?'#26c6a0':'#555';ctx.fillRect(x0+k*(bw+gap),yy+10,bw,16)}};
  y+=P;bar(y,'Volume',SET.vol,10,'v');

  text('Reduced motion also disables shake, vibration and rings.',W/2,y+RH+14,11,'#cde8d4','center','600');

// v7 render interpolation: draw entities between previous and current fixed step (alpha = acc/STEP), then restore sim values
let _sv=[];
function lerpApply(a){
  _sv=[];if(a>=1||reduceMotion&&false)return;
  const L=(o)=>{if(o.px===undefined)return;_sv.push([o,o.x,o.y,o.gc]);o.x=o.px+(o.x-o.px)*a;if(o.py!==undefined)o.y=o.py+(o.y-o.py)*a;if(o.pgc!==undefined)o.gc=o.pgc+(o.gc-o.pgc)*a};
  L(player);for(const arr of [defs,pickups,walls,parts])for(const o of arr)L(o);
  _sv.push(scroll);let d=scroll-pscroll;if(d>0)d-=80;scroll=pscroll+d*a;if(scroll<0)scroll+=80;   // scroll wraps mod 80 (it only increases)
}
function lerpRestore(){
  if(!_sv.length)return;
  const sc=_sv.find(v=>typeof v==='number');
  for(const v of _sv)if(typeof v!=='number'){v[0].x=v[1];v[0].y=v[2];if(v[3]!==undefined)v[0].gc=v[3]}
  if(sc!==undefined)scroll=sc;_sv=[];
}
function render(){
  if(focusState!==state){focusState=state;focusIdx=-1;focusId=''}   // reset keyboard focus on screen change
  buttons=[];
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#071c0f';ctx.fillRect(0,0,cv.width/dpr,cv.height/dpr);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy);
  ctx.save();
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  if(shake>0&&SET.shake&&!reduceMotion)ctx.translate((Math.random()-0.5)*10*shake*2,(Math.random()-0.5)*10*shake*2);
  lerpApply(state==='play'&&countdown<=0?Math.max(0,Math.min(1,acc/STEP)):1);
  drawField();
  for(const p of pickups)drawPickup(p);
  for(const w of walls)drawWall(w);
  for(const d of defs)drawDefender(d);
  drawWarns();
  if(dashT>0)drawDashFx(SKINS[skinIdx].fx,player.x,player.y);
  if(daily&&ghostPlay&&state==='play'&&countdown<=0){const gf=t/0.1,gi=Math.floor(gf);if(gi+1<ghostPlay.length){const gx=ghostPlay[gi]+(ghostPlay[gi+1]-ghostPlay[gi])*(gf-gi);ctx.globalAlpha=0.35;drawDog(gx,player.y,0,0,0,false,SKINS[skinIdx]);ctx.globalAlpha=1;text('BEST',gx,player.y-30,10,'#fff')}}
  if(state!=='over')drawDog(player.x,player.y,player.lean,player.shield,player.inv);
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life*1.5);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4)}
  ctx.globalAlpha=1;
  for(const q of texts){ctx.globalAlpha=Math.min(1,q.life*2);text(q.s,q.x,q.y,15,q.c);}
  ctx.globalAlpha=1;
  if(state==='play'||state==='pause')drawHud();
  if(dbg)drawDebug();
  if(state==='title')drawTitle();
  else if(state==='help')drawHelp();
  else if(state==='skins')drawSkins();
  else if(state==='stats')drawStats();
  else if(state==='settings')drawSettings();
  else if(state==='over')drawOver();
  else if(state==='pause')drawPause();
  if(focusId){const b=buttons.find(q=>q.id===focusId);if(b){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([6,4]);rr(b.x-3,b.y-3,b.w+6,b.h+6,14);ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1}}
  lerpRestore();
  ctx.restore();
}

// ---------- input ----------
let focusIdx=-1,focusId='',focusState='',dragId=null,lastPX=0,dragY0=0,dragT0=0,swiped=false;
function toLogical(e){return{x:(e.clientX-ox)/scale,y:(e.clientY-oy)/scale}}
function press(id){
  initAudio();
  switch(id){
    case 'play':if(state==='over'&&gameOverT<0.3)break;startGame(daily&&state==='over');break;
    default:if(id.indexOf('skin')===0&&state==='skins'){const i=+id.slice(4);if(SKINS[i]&&SKINS[i].need<=totalCoins){skinIdx=i;lsSet('sdr_skin',i);sfx.click()}}
    break;
    case 'daily':startGame(true);break;
    case 'skin':state='skins';sfx.click();break;
    case 'stats':state='stats';sfx.click();break;
    case 'help':state='help';sfx.click();break;
    case 'back':state='title';sfx.click();break;
    case 'title':state='title';reset();sfx.click();break;
    case 'resume':resumeGame();sfx.click();break;
    case 'dash':doDash();break;
    case 'pause':pause();sfx.click();break;
    case 'mute':toggleMute();break;
    case 'diff':SET.diff=(SET.diff+1)%3;syncBest();saveSet();sfx.click();say('Mode '+DIFF[SET.diff].n);break;
    case 'set':state='settings';sfx.click();say('Settings');break;
    case 'set_snd':toggleMute();break;
    case 'set_mus':SET.music=SET.music?0:1;saveSet();sfx.click();break;
    case 'set_shk':SET.shake=SET.shake?0:1;saveSet();sfx.click();break;
    case 'set_hap':SET.haptics=SET.haptics?0:1;saveSet();sfx.click();break;
    case 'set_rm':SET.rm=SET.rm?0:1;reduceMotion=osRM||!!SET.rm;saveSet();sfx.click();break;
    case 'set_fx':SET.fx=SET.fx?0:1;saveSet();sfx.click();say('Visual effects '+(SET.fx?'on':'off'));break;
    case 'set_pob':SET.pob=SET.pob?0:1;saveSet();sfx.click();say('Pause on focus loss '+(SET.pob?'on':'off'));break;
    case 'set_cb':SET.cb=SET.cb?0:1;saveSet();sfx.click();break;
    case 'set_vd':SET.vol=Math.max(0,SET.vol-1);saveSet();applyVol();sfx.click();say('Volume '+SET.vol);break;
    case 'set_vu':SET.vol=Math.min(10,SET.vol+1);saveSet();applyVol();sfx.click();say('Volume '+SET.vol);break;
    case 'set_hc':SET.hc=SET.hc?0:1;saveSet();sfx.click();say('High contrast outline '+(SET.hc?'on':'off'));break;
    case 'set_md':SET.mvol=Math.max(0,SET.mvol-1);saveSet();applyVol();sfx.click();say('Music volume '+SET.mvol);break;
    case 'set_mu':SET.mvol=Math.min(10,SET.mvol+1);saveSet();applyVol();sfx.click();say('Music volume '+SET.mvol);break;
    case 'set_big':SET.big=SET.big?0:1;saveSet();sfx.click();break;
    case 'set_side':SET.left=SET.left?0:1;saveSet();sfx.click();say('Dash button on the '+(SET.left?'left':'right'));break;
    case 'set_sd':SET.sens=Math.max(1,SET.sens-1);saveSet();sfx.click();say('Steer speed '+SET.sens);break;
    case 'set_su':SET.sens=Math.min(5,SET.sens+1);saveSet();sfx.click();say('Steer speed '+SET.sens);break;
    case 'reset':resetStats();break;
    case 'lbm':lbMode=(lbMode+1)%4;sfx.click();break;
    case 'share':share();break;
    case 'dbg':if(state==='title'&&++dbgTaps>=5){dbgTaps=0;dbg=!dbg;lsSet('sdr_dbg',dbg?'1':'0')}break;
  }
}
const sb=document.getElementById('sb'),sbt=document.getElementById('sbt'),sbm=document.getElementById('sbm');
function inSb(e){return e.target&&e.target.closest&&e.target.closest('#sb')}
function showShareBox(txt,msg){
  sbm.textContent=msg||'Copy your score:';sbt.value=txt;sb.style.display='block';
  try{sbt.focus();sbt.select();sbt.setSelectionRange(0,txt.length)}catch(e){}
}
document.getElementById('sbc').addEventListener('click',()=>{sb.style.display='none';sbt.blur()});
function share(){
  const txt='Super Dogs Rush'+(daily?' Daily '+dayKey+' ['+DMODS[dailyMod].n+']':'')+': '+score()+' pts, '+Math.floor(dist/10)+' yds, '+coins+' coins'+(daily&&dStreak>1?' ('+dStreak+'-day streak)':'');
  const done=m=>{shareMsg=m;setTimeout(()=>{shareMsg=''},2000)};
  const fallback=()=>{   // clipboard API unavailable/blocked (e.g. file://): try execCommand, then show selectable text
    showShareBox(txt);
    try{if(document.execCommand&&document.execCommand('copy')){sbm.textContent='Copied! (or copy manually):';done('COPIED!')}}catch(e){}
  };
  try{
    if(navigator.share){navigator.share({text:txt}).then(()=>done('SHARED'),err=>{if(!err||err.name!=='AbortError')fallback()});return}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>done('COPIED!'),fallback);return}
  }catch(e){}
  fallback();
}
function toggleMute(){muted=!muted;lsSet('sdr_muted',muted?'1':'0');initAudio();if(!muted)sfx.click()}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();
  const p=toLogical(e);
  for(const b of buttons){
    if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){
      press(b.id);
      if(state!=='play')return;
      if(b.id==='pause'||b.id==='mute'||b.id==='dash')return;
      break;   // game just started from this touch: begin steering immediately
    }
  }
  if(state==='play'&&dragId===null){dragId=e.pointerId;lastPX=p.x;dragY0=p.y;dragT0=performance.now();swiped=false;try{cv.setPointerCapture(e.pointerId)}catch(_){}}
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==dragId)return;e.preventDefault();
  const p=toLogical(e);player.tx+=(p.x-lastPX)*SENS[SET.sens-1];lastPX=p.x;
  if(!swiped&&state==='play'&&dragY0-p.y>70&&performance.now()-dragT0<350){swiped=true;doDash()}   // v9: quick swipe up = DASH
  else if(performance.now()-dragT0>350){dragY0=p.y;dragT0=performance.now()}
},{passive:false});
function endDrag(e){if(e.pointerId===dragId)dragId=null}
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
// block iOS gestures / scroll / zoom
['touchstart','touchmove','gesturestart','gesturechange','contextmenu'].forEach(n=>
  document.addEventListener(n,e=>{if(!inSb(e))e.preventDefault()},{passive:false}));
let lastTap=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTap<350&&!inSb(e))e.preventDefault();lastTap=n},{passive:false});

window.addEventListener('keydown',e=>{
  if(inSb(e))return;
  keys[e.key.toLowerCase()]=true;
  if(e.repeat&&(state!=='play'||e.key.toLowerCase()!=='p'))return;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  initAudio();
  const k=e.key.toLowerCase();
  if(k==='m')toggleMute();
  if(k==='`'||k==='f3'){dbg=!dbg;lsSet('sdr_dbg',dbg?'1':'0');e.preventDefault()}
  if(state!=='play'&&(k==='tab'||k==='arrowdown'||k==='arrowup')){e.preventDefault();const L=buttons.filter(b=>b.id!=='dbg'&&b.id!=='mute');if(L.length){const dirn=(k==='arrowup'||e.shiftKey)?-1:1;focusIdx=(focusIdx+dirn+L.length)%L.length;focusId=L[focusIdx].id;say('Focus: '+focusId)}return}
  if(state!=='play'&&focusId&&(k==='enter'||k===' ')&&(state!=='over'||gameOverT>0.5)){const id=focusId;press(id);return}
  if(state==='title'&&(k==='enter'||k===' '))startGame(false);
  else if(state==='over'&&gameOverT>0.5&&(k==='enter'||k===' '||k==='r'))startGame(daily);
  else if((state==='help'||state==='skins'||state==='stats'||state==='settings')&&(k==='enter'||k==='escape'))state='title';
  else if(state==='play'&&(k==='p'||k==='escape'))pause();
  else if(state==='pause'&&(k==='p'||k==='escape'||k==='enter'))resumeGame();
  else if(state==='play'&&(k===' '||k==='arrowup'||k==='w'||k==='shift'))doDash();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(SET.pob&&state==='play'){pause();last=0}});   // v17: optional pause on focus loss   // v6: blur no longer pauses (only hiding the tab does)
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();last=0;if(actx&&actx.state==='running')actx.suspend()}
  else if(actx&&!muted)actx.resume()});

// ---------- main loop ----------
// v10 gamepad: left stick / d-pad steer, A/B/X/Y or RT = dash, Start = pause/start/back
let gpPrev={},gpAx=0;
function pollPad(){
  let g=null;try{const l=navigator.getGamepads?navigator.getGamepads():[];for(const x of l)if(x&&x.connected){g=x;break}}catch(e){}
  if(!g){gpAx=0;return}
  const B=i=>!!(g.buttons[i]&&g.buttons[i].pressed),E=(n,v)=>{const r=v&&!gpPrev[n];gpPrev[n]=v;return r};
  let ax=+g.axes[0]||0;if(!isFinite(ax)||Math.abs(ax)<0.2)ax=0;if(B(14))ax=-1;if(B(15))ax=1;gpAx=ax;
  const dash=E('d',B(0)||B(1)||B(2)||B(3)||B(7)),start=E('s',B(9)),up=E('u',B(12)),dn=E('n',B(13));
  if(dash||start||up||dn)initAudio();
  if(state==='play'){if(dash)doDash();if(start)pause()}
  else if(state==='pause'){if(start||dash)resumeGame()}
  else if(state==='title'||(state==='over'&&gameOverT>0.5)){if(start||dash)startGame(state==='over'&&daily)}
  else if(state!=='over'){if(start)state='title'}
}
let last=0;
const STEP=1/120;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  const dt=Math.min(0.05,(ts-last)/1000);last=ts;
  try{pollPad()}catch(e){}
  if(state==='play'){   // fixed timestep: simulation advances in exact STEP increments (deterministic for a given input sequence)
    acc+=dt;let n=0;steps=0;
    while(acc>=STEP&&n<8&&state==='play'){update(STEP);acc-=STEP;n++}
    steps=n;if(state!=='play')acc=0;
  }else{acc=0;updateIdle(dt)}
  fpsN++;fpsT+=dt;if(fpsT>=0.5){fps=Math.round(fpsN/fpsT);fpsN=0;fpsT=0}
  ialpha=state==='play'?Math.min(1,acc/STEP):1;
  render();
}
// ---------- v7 PWA: runtime-built icon + manifest (single file, no external assets) ----------
function setupPWA(){
  try{
    const mk=n=>{const c=document.createElement('canvas');c.width=c.height=n;const g=c.getContext('2d'),u=n/192;
      g.fillStyle='#0b3d1e';g.fillRect(0,0,n,n);g.fillStyle='#22883f';g.fillRect(0,n*0.62,n,n*0.38);
      g.fillStyle='#ffcc00';g.beginPath();g.arc(n/2,n*0.68,48*u,Math.PI,0);g.fillRect(n/2-48*u,n*0.68,96*u,34*u);g.fill();   // jersey
      g.fillStyle='#c68642';g.beginPath();g.arc(n/2,n*0.42,46*u,0,6.283);g.fill();
      g.fillStyle='#6b3f17';g.beginPath();g.ellipse(n/2-46*u,n*0.4,14*u,30*u,0.3,0,6.283);g.ellipse(n/2+46*u,n*0.4,14*u,30*u,-0.3,0,6.283);g.fill();
      g.fillStyle='#fff';g.beginPath();g.arc(n/2-16*u,n*0.38,10*u,0,6.283);g.arc(n/2+16*u,n*0.38,10*u,0,6.283);g.fill();
      g.fillStyle='#111';g.beginPath();g.arc(n/2-16*u,n*0.375,5*u,0,6.283);g.arc(n/2+16*u,n*0.375,5*u,0,6.283);g.arc(n/2,n*0.5,9*u,0,6.283);g.fill();
      return c.toDataURL('image/png')};
    const i192=mk(192),i512=mk(512);
    const l=document.createElement('link');l.rel='apple-touch-icon';l.href=i192;document.head.appendChild(l);
    const l2=document.createElement('link');l2.rel='icon';l2.href=i192;document.head.appendChild(l2);
    const man={name:'Super Dogs Rush',short_name:'Dogs Rush',start_url:location.href.split('#')[0],display:'fullscreen',orientation:'portrait',background_color:'#071c0f',theme_color:'#0b3d1e',
      icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any'}]};
    const m=document.createElement('link');m.rel='manifest';m.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.appendChild(m);
  }catch(e){}
}
setupPWA();
try{if(navigator.serviceWorker&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
reset();
requestAnimationFrame(frame);
})();
