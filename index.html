<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Adrian's Games">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Adrian's Games</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #1a1030;
    color: #fff;
    padding:
      calc(28px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(28px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
  }
  main {
    max-width: 420px;
    margin: 0 auto;
    min-height: calc(100vh - 56px);
    min-height: calc(100dvh - 56px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
  }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 8vw, 2.6rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
  }
  h2 {
    margin: 0 0 6px;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
  }
  .offline, .steps {
    margin: 0;
    color: #e6d8ff;
    font-size: 1.05rem;
    line-height: 1.4;
  }
  nav {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin: 8px 0 4px;
  }
  a.play {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 92px;
    padding: 18px 20px;
    border-radius: 22px;
    text-decoration: none;
    color: #fff;
    font-size: clamp(1.35rem, 5.5vw, 1.7rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    text-align: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  a.play:active { transform: translateY(2px); }
  a.play:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  a.dogs {
    background: #0b3d1e;
    box-shadow: inset 0 0 0 3px #ffcc00;
  }
  a.makeover {
    background: #a01466;
    box-shadow: inset 0 0 0 3px #ffd0ec;
  }
  .howto {
    margin-top: 8px;
    padding: 16px 16px 14px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.08);
  }
  .steps { font-weight: 700; color: #fff; }
</style>
</head>
<body>
<main>
  <h1>Adrian's Games</h1>
  <p class="offline">Each game works offline after the first open.</p>
  <nav>
    <a class="play dogs" href="super-dogs-rush/">Super Dogs Rush</a>
    <a class="play makeover" href="makeover-rescue/">Makeover Rescue</a>
  </nav>
  <section class="howto">
    <h2>Add to Home Screen</h2>
    <p class="steps">Safari &gt; Share &gt; Add to Home Screen</p>
  </section>
</main>
</body>
</html>
