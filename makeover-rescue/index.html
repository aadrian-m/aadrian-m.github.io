<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Makeover">
<meta name="theme-color" content="#2c1048">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Makeover Rescue: Glow-Up Countdown (v2)</title>
<style>
:root{--pk:#ff4fa3;--pk2:#ff9bd0;--pu:#9b5de5;--pu2:#d9c2ff;--rg:#f0b3a8;--gold:#f6d27a;--dk:#2b0f40;--ink:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:#1d0a2e;touch-action:manipulation}
#app{position:relative;height:100vh;height:100dvh;max-width:480px;margin:0 auto;overflow:hidden;background:#2c1048}
#salon{position:absolute;inset:0}#salon svg{width:100%;height:100%;display:block}
.bokeh{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bokeh i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,200,240,0) 70%);animation:fl 9s linear infinite;opacity:0}
@keyframes fl{0%{transform:translateY(40px) scale(.6);opacity:0}15%{opacity:.8}100%{transform:translateY(-760px) scale(1.2);opacity:0}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))}
.screen.on{display:flex;animation:fin .35s ease}
@keyframes fin{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
h1,h2,h3,p{margin:0}
.btn{border:0;border-radius:999px;padding:14px 26px;font:inherit;font-weight:900;font-size:19px;letter-spacing:.3px;color:#fff;background:linear-gradient(180deg,#ff8fcb,#ff3d97 60%,#e6257f);box-shadow:0 5px 0 #a8135f,0 10px 22px rgba(255,61,151,.5),inset 0 2px 0 rgba(255,255,255,.5);cursor:pointer;min-height:54px;text-shadow:0 2px 0 rgba(150,0,70,.45);position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shn 2.6s infinite}
@keyframes shn{0%,60%{left:-60%}100%{left:130%}}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a8135f}
.btn.pu{background:linear-gradient(180deg,#c9a2ff,#9455ea 60%,#7a3fd0);box-shadow:0 5px 0 #4d1f96,0 10px 22px rgba(148,85,234,.5),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.gd{background:linear-gradient(180deg,#ffe9a3,#f0b840 60%,#d99a1c);color:#5b2a00;text-shadow:0 1px 0 rgba(255,255,255,.5);box-shadow:0 5px 0 #9a6410,0 10px 22px rgba(240,184,64,.5),inset 0 2px 0 rgba(255,255,255,.6)}
.btn:disabled{filter:grayscale(.85) brightness(.9);opacity:.55;box-shadow:0 3px 0 #555}
.btn:disabled::after{display:none}
.ghost{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:9px 16px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;backdrop-filter:blur(6px);min-height:44px}
.glass{background:linear-gradient(160deg,rgba(60,20,90,.78),rgba(110,35,110,.72));border:1.5px solid rgba(255,214,240,.55);border-radius:22px;box-shadow:0 10px 30px rgba(20,0,40,.5),inset 0 1px 0 rgba(255,255,255,.3);backdrop-filter:blur(10px)}
.gold{color:var(--gold);text-shadow:0 2px 6px rgba(0,0,0,.45)}
/* title */
#title{align-items:center;justify-content:space-between;text-align:center;padding-bottom:20px}
.logo{margin-top:14px;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:46px;line-height:.95;font-weight:900;background:linear-gradient(180deg,#fff,#ffd2ee 45%,#f0b3a8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #a8135f) drop-shadow(0 6px 14px rgba(255,79,163,.8))}
.lplate{margin-top:14px;width:74%;padding:8px 14px 10px;border-radius:30px;background:linear-gradient(180deg,rgba(28,6,46,.94),rgba(60,14,76,.9));border:1.5px solid rgba(255,214,240,.45);box-shadow:0 8px 24px rgba(20,0,40,.5);position:relative;z-index:3}
.lplate .logo{margin-top:0}
.logo small{display:block;font-family:inherit;font-size:14px;letter-spacing:3.5px;font-style:normal;margin-top:6px;background:linear-gradient(90deg,#f6d27a,#fff,#f6d27a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:none}
.tdoll{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-end;position:relative}
.tdoll svg{height:100%;max-height:100%;filter:drop-shadow(0 0 22px rgba(255,150,220,.55));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.shelf{display:flex;gap:6px;justify-content:center;align-items:flex-end;height:46px;margin:6px 0}
.shelf .sl{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,.12)}
.shelf .sl svg{height:34px;width:34px}.shelf .sl.off{filter:grayscale(1) brightness(.35);opacity:.6}
.pbar{width:78%;height:20px;border-radius:99px;background:rgba(0,0,0,.35);border:2px solid rgba(255,214,240,.6);overflow:hidden;position:relative}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#9b5de5,#ff4fa3,#f6d27a);border-radius:99px;transition:width .6s}
.cap{font-size:15px;font-weight:900;margin:6px 0;padding:5px 14px;border-radius:99px;background:rgba(30,8,50,.72);border:1.5px solid rgba(255,214,240,.5);color:#fff;text-shadow:0 1px 3px #000}
/* rounds */
#rounds .hd{display:flex;align-items:center;gap:10px;margin:6px 0 10px}#rounds h2{font-size:26px;flex:1;text-align:center;margin-right:46px;font-family:Georgia,serif;font-style:italic}
.rc{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:7px 0;cursor:pointer;position:relative}
.rc .n{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--pk),var(--pu));font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 14px rgba(255,79,163,.7)}
.rc .t{flex:1;min-width:0}.rc .t b{display:block;font-size:18px}.rc .t small{font-size:14px;opacity:.85}
.rc.lock{filter:grayscale(1) brightness(.55);cursor:default}
.stars{color:#ffc83a;font-size:22px;letter-spacing:2px;text-shadow:0 0 8px rgba(255,200,60,.7)}.stars .off{color:rgba(255,255,255,.28);text-shadow:none}
/* meet */
.briefTag{display:inline-block;font-size:12px;font-weight:900;letter-spacing:1px;color:#ffe9a3;background:rgba(0,0,0,.35);border:1px solid rgba(246,210,122,.6);border-radius:99px;padding:3px 12px;margin-bottom:4px}
#meet{align-items:center;text-align:center}
.meetcard{margin-top:6px;padding:14px;width:100%}
.meetcard h2{font-size:26px;font-family:Georgia,serif;font-style:italic}
.chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.45);border-radius:99px;padding:6px 12px;font-size:15px;font-weight:800;margin:3px}
.chip.no{background:rgba(255,60,90,.3);border-color:#ff7a90}
.chip.ban{background:rgba(255,200,60,.3);border-color:var(--gold)}
.mdoll{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-end}.mdoll svg{height:100%}
/* play */
#play{padding:calc(6px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom))}
#hud{display:flex;align-items:center;gap:10px;height:70px;flex:none;padding:4px 6px;border-radius:22px;background:linear-gradient(180deg,rgba(30,8,50,.78),rgba(60,16,80,.55));backdrop-filter:blur(8px);border:1.5px solid rgba(255,214,240,.35)}
.ringw{position:relative;width:62px;height:62px;flex:none}
.ringw svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringw b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;text-shadow:0 2px 4px #000}
.ringw.low{animation:pls .5s infinite alternate}@keyframes pls{to{transform:scale(1.12)}}
.hmid{flex:1;min-width:0}
.evn{font-size:19px;font-weight:900;line-height:1.1;font-family:Georgia,serif;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}.chips .chip{padding:3px 8px;font-size:13px;margin:2px 2px 0 0;white-space:nowrap}
.score{width:74px;flex:none;text-align:center;padding:4px 2px;border-radius:16px;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,214,240,.5)}
.score b{display:block;font-size:26px;line-height:1;font-weight:900}.score small{font-size:12px;font-weight:800;opacity:.85}
.score .stars{font-size:15px;letter-spacing:0}
#mute{position:absolute;right:10px;top:calc(6px + env(safe-area-inset-top));display:none}
#banner{flex:none;height:38px;margin:2px 4px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;text-align:center;padding:0 12px;background:rgba(0,0,0,.4);border:1.5px solid rgba(255,214,240,.4);transition:background .2s,transform .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#banner.hotb{background:linear-gradient(90deg,#ff4fa3,#9b5de5);border-color:#fff;transform:scale(1.03);box-shadow:0 0 18px rgba(255,79,163,.8)}
#stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.dollbox{flex:1;min-height:0;position:relative;display:flex;justify-content:center;align-items:flex-end}
.dollwrap{position:relative;height:100%;aspect-ratio:300/610;max-width:100%}
.dollwrap>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 14px rgba(20,0,40,.5));animation:idle 3.6s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-3px) rotate(.3deg)}}
.dollwrap.bounce>svg{animation:bnc .7s ease}
@keyframes bnc{0%{transform:scale(1)}25%{transform:scale(1.06,.96)}50%{transform:scale(.97,1.04) translateY(-10px)}100%{transform:none}}
.hs{position:absolute;width:13%;aspect-ratio:1;margin:-10% 0 0 -10%;border-radius:50%;border:3px dashed #fff;background:radial-gradient(circle,rgba(255,79,163,.6),rgba(255,79,163,.2) 70%);animation:hp 1.1s ease-in-out infinite;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:3;box-shadow:0 0 16px rgba(255,79,163,.9)}
.hs b{font-size:22px;filter:drop-shadow(0 1px 2px #000)}
@keyframes hp{50%{transform:scale(1.18);box-shadow:0 0 26px rgba(255,255,255,.9)}}
.hs.big{width:13%}
.bubble{position:absolute;z-index:4;max-width:46%;padding:9px 12px;border-radius:18px;background:#fff;color:#4a1650;font-weight:800;font-size:15px;line-height:1.15;box-shadow:0 6px 16px rgba(0,0,0,.4);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.bubble::after{content:"";position:absolute;bottom:-9px;left:22px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes pop{from{transform:scale(.3);opacity:0}}
#pops{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.pp{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-size:26px;font-weight:900;white-space:nowrap;text-shadow:0 3px 0 #a8135f,0 0 16px #ff4fa3;animation:ppf 1.6s ease-out forwards}
@keyframes ppf{0%{transform:translate(-50%,20px) scale(.4);opacity:0}15%{transform:translate(-50%,0) scale(1.15);opacity:1}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
#dock{display:flex;gap:6px;flex:none;padding:6px 0 0}
.stn{flex:1;min-width:0;height:84px;border-radius:18px;border:2px solid rgba(255,214,240,.55);background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));color:#fff;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;backdrop-filter:blur(6px)}
.stn .ic{font-size:32px;line-height:1}.stn .lb{font-size:14px;font-weight:900}.stn .st{font-size:11px;font-weight:800;opacity:.9}
.stn.todo{border-color:#ff7ac0;box-shadow:0 0 14px rgba(255,79,163,.9);animation:tp 1s ease-in-out infinite alternate}
@keyframes tp{to{box-shadow:0 0 24px rgba(255,255,255,.95)}}
.stn.done{border-color:#7dffb2;background:linear-gradient(180deg,rgba(80,230,150,.4),rgba(40,160,110,.25))}
.stn.done::after{content:"✓";position:absolute;top:-8px;right:-4px;width:24px;height:24px;border-radius:50%;background:#2fd37d;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0007}
.stn.lock{filter:grayscale(1) brightness(.5);background:rgba(0,0,0,.45);border-style:dashed;border-color:#999;cursor:not-allowed}
.stn.lock .ic{font-size:26px}
.stn.shake{animation:shk .4s}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#earlybtn{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;bottom:98px;z-index:15;font-size:12px;padding:5px 12px;min-height:36px;background:rgba(30,8,50,.8)}
#revealbtn{position:absolute;left:8%;right:8%;bottom:98px;z-index:15;animation:rv 1s ease-in-out infinite alternate}@keyframes rv{to{transform:scale(1.06)}}
/* station panel */
#panel{position:absolute;inset:0;z-index:10;display:none;flex-direction:column}
#panel.on{display:flex;animation:fin .25s}
#pdoll{flex:none;position:relative;display:flex;justify-content:center;align-items:flex-end;margin:2px 0 4px}
#pdoll svg{height:100%;filter:drop-shadow(0 4px 12px rgba(20,0,40,.5))}
#pbody{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 10px 10px;gap:8px;animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.ptitle{display:flex;align-items:center;gap:8px}.ptitle h3{flex:1;font-size:20px;font-family:Georgia,serif;font-style:italic}
.back{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);color:#fff;font-size:22px;font-weight:900;cursor:pointer}
.lab{font-size:14px;font-weight:900;letter-spacing:.5px;opacity:.9;margin:2px 0}
.grid{display:grid;gap:8px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.opt{min-height:56px;border-radius:16px;border:2.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;font:inherit;font-weight:800;font-size:14px;line-height:1.1;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 3px;position:relative;transition:transform .12s,box-shadow .2s}
.opt:active{transform:scale(.94)}
.opt.sel{border-color:#fff;background:linear-gradient(180deg,rgba(255,120,200,.7),rgba(155,93,229,.7));box-shadow:0 0 18px rgba(255,160,220,.95)}
.sw{width:54px;height:54px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 -8px 12px rgba(0,0,0,.28),inset 0 6px 8px rgba(255,255,255,.5);display:block;flex:none}
.swo{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:800;line-height:1.05;cursor:pointer;background:none;border:0;color:#fff;font-family:inherit;padding:2px 0;text-align:center}
.swo{padding:3px 2px;border-radius:14px;border:2px solid transparent}.swo.sel .sw{box-shadow:0 0 0 3px #ff4fa3,0 0 0 5px #fff,0 3px 8px rgba(0,0,0,.4)}
.swo.sel{color:#2b0a3d;background:#fff;border-color:#ff4fa3;text-shadow:none;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.fit{font-size:12px;color:#ffd0ea}
.tabs{display:flex;gap:6px}.tabs button{flex:1;min-height:46px;border-radius:14px;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-weight:900;font-size:15px;cursor:pointer}
.tabs button.on{background:linear-gradient(180deg,#ff8fcb,#c04bd8);border-color:#fff}
.tabs button.ok::after{content:" ✓";color:#7dffb2}
.items{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;align-content:start;padding:2px}
.items.dr{grid-template-columns:repeat(4,1fr)}
.card{border-radius:14px;border:2.5px solid rgba(255,255,255,.4);background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.1));cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:3px 2px 4px;font:inherit;color:#fff;font-size:11.5px;font-weight:800;line-height:1.05;text-align:center;height:132px;overflow:hidden}
.card.tall{height:196px}
.card svg{width:100%;flex:1;min-height:0;pointer-events:none}
.card.sel{border-color:#fff;background:linear-gradient(180deg,rgba(255,120,200,.75),rgba(155,93,229,.7));box-shadow:0 0 16px rgba(255,170,225,.95)}
.card .fit{font-size:11px;margin-top:1px}
.card:active{transform:scale(.95)}
.timing{position:relative;height:46px;border-radius:99px;background:rgba(0,0,0,.45);border:2px solid #fff;overflow:hidden}
.timing .zone{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#9bffc4,#2fd37d);border-radius:99px;box-shadow:0 0 14px #7dffb2}
.timing .mk{position:absolute;top:-2px;bottom:-2px;width:10px;margin-left:-5px;background:#fff;border-radius:6px;box-shadow:0 0 12px #fff,0 0 4px #ff4fa3}
.workwrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;position:relative}
#cv{touch-action:none;border-radius:22px;background:radial-gradient(circle at 50% 30%,#fff1f8,#f6d6ea);box-shadow:inset 0 0 0 3px rgba(255,255,255,.8),0 8px 24px rgba(0,0,0,.4);max-width:100%;max-height:100%}
.prog{position:static;align-self:center;background:rgba(43,15,64,.85);padding:4px 14px;border-radius:99px;font-weight:900;font-size:15px;border:1.5px solid #fff;color:#fff}
/* reveal */
#reveal{padding:0}
#stagebg{position:absolute;inset:0}#stagebg svg{width:100%;height:100%}
#rvhead{position:absolute;z-index:5;top:calc(18px + env(safe-area-inset-top));left:104px;right:8px;text-align:center;font:italic 900 24px/1.1 Georgia,serif;color:#f6d27a;text-shadow:0 2px 8px #12041f;white-space:nowrap;pointer-events:none}
#walker{position:absolute;left:50%;bottom:48%;height:min(49%,calc(52% - 100px));aspect-ratio:300/610;transform-origin:50% 100%;z-index:3}
#walker svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 20px rgba(255,160,230,.7))}
#before{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top));z-index:6;width:86px;background:#fff;border-radius:6px;padding:5px 5px 14px;color:#4a1650;font-weight:900;font-size:12px;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.5);transform:rotate(-5deg)}
#before svg{width:100%;height:112px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
#flash.go{animation:fl3 .5s ease-out}@keyframes fl3{0%{opacity:.95}100%{opacity:0}}
#res{position:absolute;left:8px;right:8px;bottom:8px;z-index:8;padding:14px 14px 12px;transform:translateY(120%);transition:transform .7s cubic-bezier(.2,1.1,.3,1);text-align:center}
#res.on{transform:none}
#res .big{font-size:56px;font-weight:900;line-height:1;font-family:Georgia,serif}
#res .pr{font-size:21px;font-weight:900;margin:2px 0 4px}
#res .bd{text-align:left;font-size:14.5px;font-weight:700;margin:6px 4px;line-height:1.4;max-height:132px;overflow:auto}
#res .bd div{display:flex;justify-content:space-between;gap:8px}.bd .neg{color:#ff9aae}.bd .pos{color:#9bffc4}
.pop3 span{display:inline-block;animation:sp .6s cubic-bezier(.2,1.8,.4,1) both}@keyframes sp{from{transform:scale(0) rotate(-90deg)}}
#conf{position:absolute;inset:0;pointer-events:none;z-index:25;width:100%;height:100%}
/* prize */
#prize{align-items:center;justify-content:center;text-align:center;gap:6px}
.rays{position:absolute;left:50%;top:38%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(from 0deg,rgba(255,230,160,.35) 0 7deg,transparent 7deg 20deg);border-radius:50%;animation:spin 18s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 10%,transparent 62%);mask-image:radial-gradient(circle,#000 10%,transparent 62%)}
@keyframes spin{to{transform:rotate(360deg)}}
.pcase{position:relative;width:300px;height:330px;z-index:2}
.pcase svg{width:100%;height:100%;overflow:visible}

      refreshPDoll('10 0 280 610');sparkleDoll();render();$('#dn',pc).disabled=!valid()});
    $('#dn',pc).disabled=!valid()}
  const sparkleDoll=()=>burstAt($('#pdoll',$('#panel')),14);
  render();$('#dn',pc).onclick=()=>{if(valid())closeStation(true,null,'outfit')}}
function stBag(P){const C=G.C,ev=C.ev;const pc=panelShell(P,'Bag Boutique','10 0 280 610',Math.min(250,innerHeight*.3),'Pick the bag that finishes the look!');
  const showFit=G.r<2;
  pc.innerHTML=`<div class="grid g3" id="bg" style="flex:1;align-content:start">${Object.keys(BAGS).map(k=>{const b=BAGS[k],f=vibeFit(ev,b);return`<button class="card tall" data-k="${k}" style="height:178px">${bagSVG(b)}<span>${b.n}</span>${showFit?`<span class="fit">${f>=.85?'♥♥♥':f>=.5?'♥♥':'♥'}</span>`:''}</button>`}).join('')}</div>`;
  const sync=()=>$$('#bg > button.card',pc).forEach(b=>b.classList.toggle('sel',b.dataset.k===G.look.bag));sync();
  $$('#bg > button.card',pc).forEach(b=>b.onclick=()=>{G.look.bag=b.dataset.k;sfx.pick();refreshPDoll();sync();burstAt(b,14);setTimeout(()=>{if(G.open==='bag')closeStation(true,null,'bag')},650)})}
/* ---- finish & reveal ---- */
function finishRound(timeout){if(G.over)return;G.over=true;if(G.loopId)clearInterval(G.loopId);if(G.open){G.open=null}$('#panel')&&$('#panel').classList.remove('on');const s=scoreAll(G);G.score=s;sfx.shutter();
  renderReveal(timeout)}
function renderReveal(timeout){const s=G.score,C=G.C;const mood=s.total>=60?3:s.total>=40?2:1;const stars=starsFor(s.total);
  const lookDone=clone(G.look);
  $('#reveal').innerHTML=`<div id="stagebg">${runwaySVG()}</div><h2 id="rvhead">✦ THE REVEAL ✦</h2><div id="before"><div>BEFORE</div>${dollSVG(C,freshLook(),{mood:0,mk:0,vb:'40 0 220 610'})}</div>
   <div id="walker">${dollSVG(C,G.look,{mood,mk:mkOf()})}</div><div id="flash"></div>
   <div id="res" class="glass"><div class="stars pop3" id="rst" style="font-size:40px"></div><div class="big gold" id="rsc">0</div><div class="pr" id="rpr"></div><div class="bd" id="rbd"></div><div class="row" style="display:flex;gap:8px"><button class="btn pu" id="rb1" style="flex:1;font-size:16px;padding:12px 6px">↻ Retry</button><button class="btn" id="rb2" style="flex:1.4;font-size:16px;padding:12px 6px"></button></div></div>`;
  go('reveal');
  const w=$('#walker');w.animate([{transform:'translateX(-50%) scale(.28) translateY(-40px)',opacity:.2,offset:0},{transform:'translateX(-47%) scale(.5) translateY(-20px)',offset:.3},{transform:'translateX(-53%) scale(.72) translateY(-8px)',offset:.6},{transform:'translateX(-50%) scale(1) translateY(0)',opacity:1,offset:1}],{duration:3200,easing:'ease-out',fill:'forwards'});
  const fl=()=>{const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');sfx.shutter()};
  [1200,1800,2300,3000,3300].forEach((t,i)=>setTimeout(fl,t));
  setTimeout(()=>{const a=$('#app').getBoundingClientRect();for(let i=0;i<4;i++)setTimeout(()=>confetti(a.width*(.2+i*.2),a.height*.3,stars>0?50:10,10),i*140);if(stars>0)sfx.fan()},3250);
  setTimeout(()=>{const res=$('#res');res.classList.add('on');
    const rows=s.rows.map(r=>`<div><span>${STN[r.st][1]}${r.done?'':' (skipped!)'}</span><span class="${r.done?(r.q>=.7?'pos':''):'neg'}">${r.pts.toFixed(0)} / ${r.max.toFixed(0)}</span></div>`).join('')+
      `<div><span>Wish: ${C.wish.t}</span><span class="${s.wOK?'pos':'neg'}">${s.wOK?'+10 ✓':'0 ✗ ('+C.wish.d+')'}</span></div>`+
      (s.hits.length?`<div><span>No-go ${C.nogo}${G.banned?'/'+G.banned:''} used!</span><span class="neg">${s.ng}</span></div>`:`<div><span>No-go color avoided</span><span class="pos">+${s.ng}</span></div>`)+
      `<div><span>Speed bonus</span><span class="${s.speed>0?'pos':''}">+${s.speed.toFixed(0)}</span></div>`;
    $('#rbd').innerHTML=rows;$('#rpr').textContent=praise(s.total);
    $('#rst').innerHTML=[0,1,2].map(k=>`<span style="animation-delay:${.3+k*.25}s;${k<stars?'':'opacity:.25;filter:grayscale(1)'}">★</span>`).join('');
    let n=0;const iv=setInterval(()=>{n=Math.min(s.total,n+Math.ceil(s.total/30));$('#rsc').textContent=n;if(n>=s.total)clearInterval(iv)},30);
    if(stars>0){setTimeout(sfx.good,500)}
    const old=S.stars[G.r];if(stars>old)S.stars[G.r]=stars;S.coins+=G.coins;
    if(stars>=2){const bk=Object.keys(BAGS)[G.r];if(bk&&!S.bags.includes(bk))S.bags.push(bk)}
    const last=G.r===4,win=last&&s.total>=60;const firstWin=win&&!S.won;if(win)S.won=true;save();
    const nxt=$('#rb2');
    if(win&&firstWin){nxt.textContent='👜 Open the Dream Bag!';nxt.onclick=()=>showPrize()}
    else if(stars>=1&&G.r<4){nxt.textContent='Next client ➜';nxt.onclick=()=>{sfx.pick();startRound(G.r+1)}}
    else{nxt.textContent='Rounds ☰';nxt.onclick=()=>{renderRounds();go('rounds')}}
    $('#rb1').onclick=()=>{sfx.pick();startRound(G.r)}},3600)}
function showPrize(){$('#prize').innerHTML=`<div class="rays"></div><div class="ptxt"><h2 class="gold">Dream Bag Unlocked!</h2></div>
  <div class="pcase"><svg viewBox="0 0 300 330"><defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#bfe8ff" stop-opacity=".12"/></linearGradient><linearGradient id="pd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe4f4"/><stop offset="1" stop-color="#e79ac0"/></linearGradient></defs>
  <ellipse cx="150" cy="300" rx="130" ry="18" fill="#000" opacity=".35"/><path d="M40 270 L260 270 L276 304 L24 304Z" fill="url(#pd)" stroke="#f6d27a" stroke-width="3"/><rect x="40" y="250" width="220" height="24" rx="6" fill="#f0b3a8"/>
  <path d="M52 250 L52 70 Q150 20 248 70 L248 250Z" fill="rgba(200,240,255,.12)" stroke="#f6d27a" stroke-width="3"/><g id="lid"><path d="M52 250 L52 70 Q150 20 248 70 L248 250Z" fill="url(#gl)" stroke="#fff" stroke-opacity=".6" stroke-width="2"/><path d="M70 220 L100 90 M95 235 L145 60" stroke="#fff" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"/></g></svg>
  <div id="pbag">${bagSVG(BAGS.dream)}</div></div>
  <div class="ptxt"><p style="font-size:22px;font-weight:900">Rose-Gold Dream Satchel</p><p style="font-size:15px;margin-top:4px;font-weight:700">A Coach-style designer bag. You rescued every client and earned it, stylist! 💖</p></div>
  <button class="btn gd" id="pb" style="width:80%;margin-top:10px">Back to the salon ✨</button>`;
  go('prize');setTimeout(()=>{$('#lid').classList.add('open');sfx.fan()},900);setTimeout(()=>{$('#pbag').classList.add('up');const a=$('#app').getBoundingClientRect();for(let i=0;i<6;i++)setTimeout(()=>confetti(a.width/2,a.height*.4,60,12),i*220);sfx.shutter()},2000);
  $('#pb').onclick=()=>{renderTitle();go('title')}}
/* ---- backdrops ---- */
function salonSVG(){let fl='';const vx=195,vy=600,rows=9;let y0=610,hgt=8;const ys=[];for(let i=0;i<=rows;i++){ys.push(610+Math.pow(i/rows,1.6)*234)}
  for(let i=0;i<rows;i++){const ya=ys[i],yb=ys[i+1];const cols=10;for(let j=-cols;j<cols;j++){const xa=(j)*(1+(ya-610)/90)*20+195,xb=(j+1)*(1+(ya-610)/90)*20+195,xc=(j+1)*(1+(yb-610)/90)*20+195,xd=(j)*(1+(yb-610)/90)*20+195;fl+=`<polygon points="${xa},${ya} ${xb},${ya} ${xc},${yb} ${xd},${yb}" fill="${(i+j)%2?'#f6d6d0':'#e9a7b6'}"/>`}}
  let bk='';const rnd=(()=>{let s=3;return()=>(s=(s*9301+49297)%233280)/233280})();
  for(let i=0;i<22;i++)bk+=`<circle cx="${rnd()*390}" cy="${rnd()*560}" r="${8+rnd()*26}" fill="#ffd0ee" opacity="${.06+rnd()*.1}"/>`;
  const bott=(x,y,c,h,w)=>`<rect x="${x}" y="${y-h}" width="${w}" height="${h}" rx="4" fill="${c}"/><rect x="${x+w*.3}" y="${y-h-8}" width="${w*.4}" height="9" rx="2" fill="#f6d27a"/><rect x="${x+2}" y="${y-h+3}" width="3" height="${h-8}" fill="#fff" opacity=".4"/>`;
  return`<svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="wl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0e45"/><stop offset=".5" stop-color="#6c2a7c"/><stop offset="1" stop-color="#c24a86"/></linearGradient>
  <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".4" stop-color="#e5b95a"/><stop offset=".7" stop-color="#fbe6a0"/><stop offset="1" stop-color="#9c6f1f"/></linearGradient>
  <linearGradient id="mr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e4ff"/><stop offset=".5" stop-color="#d9b6f2"/><stop offset="1" stop-color="#b78fe0"/></linearGradient>
  <radialGradient id="lg"><stop offset="0" stop-color="#fff6c8" stop-opacity=".95"/><stop offset=".4" stop-color="#ffd0ee" stop-opacity=".4"/><stop offset="1" stop-color="#ffd0ee" stop-opacity="0"/></radialGradient>
  <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="gw"><feGaussianBlur stdDeviation="3"/></filter></defs>
  <rect width="390" height="844" fill="url(#wl)"/>${bk}
  <g opacity=".9">${Array.from({length:9},(_, i)=>`<rect x="${i*44+2}" y="470" width="40" height="150" rx="3" fill="#8a3a8c" opacity=".55" stroke="#f0b3a8" stroke-opacity=".5"/>`).join('')}</g><rect x="0" y="466" width="390" height="8" fill="url(#gd)"/>
  <g><path d="M55 560 L55 150 Q195 40 335 150 L335 560Z" fill="url(#gd)"/><path d="M68 548 L68 156 Q195 56 322 156 L322 548Z" fill="url(#mr)"/><path d="M68 548 L68 156 Q195 56 322 156 L322 548Z" fill="url(#fg)"/>
   <path d="M90 520 L170 160 L200 150 L130 520Z M170 540 L240 190 L255 190 L205 540Z" fill="#fff" opacity=".22"/></g>
  <g><rect x="0" y="260" width="48" height="8" fill="url(#gd)"/>${bott(6,260,'#ff6fb8',34,16)}${bott(26,260,'#b78cf2',26,14)}<rect x="0" y="360" width="48" height="8" fill="url(#gd)"/>${bott(8,360,'#f6d27a',30,18)}${bott(28,360,'#ff9bd0',36,14)}
   <rect x="342" y="260" width="48" height="8" fill="url(#gd)"/>${bott(348,260,'#b78cf2',34,16)}${bott(368,260,'#ff6fb8',24,14)}<rect x="342" y="360" width="48" height="8" fill="url(#gd)"/>${bott(350,360,'#ff9bd0',32,16)}${bott(368,360,'#f6d27a',28,16)}</g>
  <g>${[90,300].map(x=>`<line x1="${x}" y1="0" x2="${x}" y2="70" stroke="#f6d27a" stroke-width="2"/><circle cx="${x}" cy="84" r="46" fill="url(#lg)" filter="url(#gw)"/><path d="M${x-26} 94 Q${x} 56 ${x+26} 94Z" fill="url(#gd)"/><circle cx="${x}" cy="96" r="7" fill="#fff6c8"/>`).join('')}</g>
  <rect y="600" width="390" height="244" fill="#e9a7b6"/>${fl}<rect y="600" width="390" height="244" fill="url(#fg)"/><rect y="596" width="390" height="8" fill="url(#gd)"/>
  <g>${[[28,640],[362,650]].map(p=>`<g class="plant"><rect x="${p[0]-14}" y="${p[1]-4}" width="28" height="34" rx="4" fill="#c24a86"/><path d="M${p[0]} ${p[1]-4} q-34 -20 -26 -60 q22 10 26 60 q4 -40 28 -50 q6 36 -28 50 q-4 -44 12 -70 q-12 20 -12 70" fill="#3a9a6a" opacity=".9"/></g>`).join('')}</g>
  <rect width="390" height="844" fill="url(#vg)" opacity="0"/></svg><div class="bokeh">${Array.from({length:12},(_, i)=>`<i style="left:${(i*37)%100}%;top:${60+(i*13)%40}%;width:${8+i%4*6}px;height:${8+i%4*6}px;animation-delay:${i*.8}s;animation-duration:${8+i%5}s"></i>`).join('')}</div>`}
function runwaySVG(){return`<svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="sp" cx=".5" cy=".42" r=".7"><stop offset="0" stop-color="#7a2f8a"/><stop offset=".6" stop-color="#2d0f45"/><stop offset="1" stop-color="#12041f"/></radialGradient><linearGradient id="rw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb0d8"/><stop offset="1" stop-color="#e6277f"/></linearGradient><linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <rect width="390" height="844" fill="url(#sp)"/>

  ${Array.from({length:12},(_, i)=>{const t=i/11,y=330+Math.pow(t,1.5)*500,xl=195-25-Math.pow(t,1.2)*190,xr=195+25+Math.pow(t,1.2)*190;return`<circle cx="${xl}" cy="${y}" r="${3+t*8}" fill="#fff6c8"/><circle cx="${xr}" cy="${y}" r="${3+t*8}" fill="#fff6c8"/>`}).join('')}
  <path d="M-10 844 L0 780 Q60 740 120 780 L130 844Z M260 844 L270 780 Q330 740 390 780 L400 844Z" fill="#0a0212"/>
  ${Array.from({length:30},(_, i)=>`<circle cx="${(i*53)%390}" cy="${(i*97)%500}" r="${1+i%3}" fill="#fff" opacity="${.3+(i%4)*.15}"/>`).join('')}
  </svg>`}
function init(){$('#salon').innerHTML=salonSVG();renderTitle();go('title');$('#mute').textContent=S.mute?'🔇':'🔊';
  $('#mute').onclick=()=>{S.mute=!S.mute;save();$('#mute').textContent=S.mute?'🔇':'🔊'}}
window.MR={showPrize,finishRound,G:()=>G,S:()=>S,startRound,scoreAll,openStation,closeStation,stationQ};
