<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Makeover">
<meta name="theme-color" content="#2a0f40">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Makeover Rescue: Glow-Up Countdown</title>
<style>
:root{--pk:#ff4fa3;--pk2:#ff8cc8;--pu:#9b5de5;--pu2:#c9a6ff;--dk:#3b1659;--bg1:#ffe3f3;--bg2:#e9d6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Avenir Next Rounded","Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--dk);background:#2a0f40;touch-action:manipulation}
#app{position:relative;height:100vh;height:100dvh;max-width:520px;margin:0 auto;background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden}
body.sparkle #app{background:linear-gradient(135deg,#ffd0ec,#e0c8ff,#ffc4e6,#d3b8ff);background-size:300% 300%;animation:bgs 8s ease infinite}
@keyframes bgs{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:10px 12px calc(10px + env(safe-area-inset-bottom));overflow:hidden}
.screen.on{display:flex}
h1,h2,h3{margin:0}
.btn{border:0;border-radius:999px;padding:12px 22px;font:inherit;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(180deg,#ff7cc0,#ff3d97);box-shadow:0 4px 0 #c21d72,0 8px 14px rgba(194,29,114,.35);cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c21d72}
.btn.pu{background:linear-gradient(180deg,#b88cff,#8248df);box-shadow:0 4px 0 #5a2aa8,0 8px 14px rgba(90,42,168,.35)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn:disabled{filter:grayscale(.8) opacity(.55);cursor:default}
.ghost{background:rgba(255,255,255,.7);border:2px solid var(--pu2);color:var(--dk);border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.center{text-align:center}
/* title */
#title{align-items:center;justify-content:space-between;text-align:center}
.logo{font-size:32px;line-height:1;font-weight:900;color:var(--pk);text-shadow:0 3px 0 #fff,0 6px 12px rgba(155,93,229,.5);margin-top:6px}
.logo small{display:block;font-size:17px;color:var(--pu);letter-spacing:2px;margin-top:4px}
.case{width:min(78%,300px);flex:1;min-height:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.case svg{height:100%;max-height:340px;width:100%}
.prog{width:80%;max-width:330px}
.bar{height:16px;border-radius:99px;background:#fff;border:2px solid var(--pu2);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pu),var(--pk));border-radius:99px;transition:width .5s}
.decor{font-size:24px;min-height:30px;letter-spacing:6px}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
/* rounds */
.rcard{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 12px;margin:6px 0;box-shadow:0 4px 12px rgba(155,93,229,.25);border:2px solid var(--pu2)}
.rcard.lock{opacity:.5;filter:grayscale(.6)}
.rcard .n{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pk),var(--pu));color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.rcard .t{flex:1;min-width:0}.rcard .t b{display:block}.rcard .t small{opacity:.75}
.stars{color:#ffb800;letter-spacing:1px;text-shadow:0 1px 0 #fff}
.stars .off{color:#d8c6ec}
/* play HUD */
#hud{display:flex;align-items:center;gap:10px}
.ringw{position:relative;width:58px;height:58px;flex:none}
.ringw svg.rg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringw .av{position:absolute;inset:8px;border-radius:50%;overflow:hidden;background:#fff}
.ringw.red{animation:pulse .5s infinite alternate}
.ringw.ice::after{content:"";position:absolute;inset:-3px;border-radius:50%;box-shadow:0 0 14px 6px #9fe7ff;pointer-events:none}
@keyframes pulse{to{transform:scale(1.1)}}
.time{font-size:26px;font-weight:900;min-width:64px}
.hudr{margin-left:auto;text-align:right;font-weight:800;font-size:14px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 2px}
.chip{background:#fff;border:2px solid var(--pu2);border-radius:99px;padding:3px 9px;font-size:12px;font-weight:800}
.chip.ban{background:#ffe0e0;border-color:#ff5a5a}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.tabs{display:flex;gap:6px;justify-content:center;margin:2px 0}
.tabs button{padding:4px 12px}.tabs .ghost.on{background:var(--pk);color:#fff;border-color:var(--pk)}
.figbox{flex:1;min-height:0;display:flex;justify-content:center}
.figbox svg{height:100%;max-width:100%}
.hot{fill:rgba(255,40,70,.28);stroke:#ff2846;stroke-width:3;stroke-dasharray:6 4;cursor:pointer;animation:hotp 1s infinite alternate;pointer-events:all}
@keyframes hotp{to{fill:rgba(255,40,70,.6);stroke-width:5}}
.stns{display:flex;gap:6px;justify-content:center;padding:4px 0}
.stn{flex:1;max-width:92px;border:2px solid var(--pu2);background:#fff;border-radius:14px;padding:5px 2px;font:inherit;font-weight:800;font-size:11px;color:var(--dk);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.stn .ic{font-size:22px;line-height:1.1}
.stn.todo{border-color:#ff2846;box-shadow:0 0 10px rgba(255,40,70,.6);animation:hotp2 1s infinite alternate}
@keyframes hotp2{to{box-shadow:0 0 18px rgba(255,40,70,.95)}}
.stn.done{border-color:#27c46b;background:#eafff3}.stn.ok{opacity:.55}.stn.lock{opacity:.35;filter:grayscale(1)}
#boosts{display:flex;gap:6px;margin-top:4px}
.bst{flex:1;border:2px solid var(--pu);border-radius:14px;font:inherit;font-weight:800;font-size:11px;padding:5px 2px;color:var(--dk);background:#fff;cursor:pointer;position:relative;overflow:hidden}
.bst .fl{position:absolute;left:0;bottom:0;height:100%;background:linear-gradient(0deg,rgba(255,79,163,.5),rgba(155,93,229,.15));width:100%;transform-origin:left;pointer-events:none}
.bst span{position:relative}
.bst.rdy{border-color:var(--pk);box-shadow:0 0 12px var(--pk);animation:hotp2 .8s infinite alternate}
.bst.arm{background:#ffe8f6}
.mrow{display:flex;gap:10px;align-items:center;margin-top:5px;font-size:12px;font-weight:800}
.mrow .bar{flex:1;height:13px}
#mbar>i{background:linear-gradient(90deg,#ffd6f0,var(--pk),var(--pu))}
.hint{background:#fff;border-radius:14px;padding:6px 10px;margin:4px 0;font-size:13px;font-weight:700;border:2px dashed var(--pk);text-align:center}
.banner{position:absolute;top:4px;left:8px;right:8px;background:#ff2846;color:#fff;border-radius:14px;padding:6px;text-align:center;font-weight:900;z-index:5;animation:pulse .5s infinite alternate}
/* station */
.sthead{display:flex;align-items:center;gap:8px;font-size:17px}
.sthead b{flex:1;text-align:center}.sthead #stlab{font-size:12px;font-weight:700;opacity:.7}
.stbody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px;overflow:hidden}
.inst{margin:2px 0;font-weight:800;font-size:15px;text-align:center}
.pvbox{height:170px;display:flex;justify-content:center;border-radius:18px;background:rgba(255,255,255,.6);position:relative;overflow:hidden;width:100%}
.pvbox svg{height:100%}
.pvbox.tall{height:200px}
.foam{position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,#fff 0 18px,transparent 20px),radial-gradient(circle at 70% 25%,#fff 0 22px,transparent 24px),radial-gradient(circle at 50% 60%,#fff 0 26px,transparent 28px),radial-gradient(circle at 25% 75%,#fff 0 16px,transparent 18px),radial-gradient(circle at 78% 70%,#fff 0 20px,transparent 22px);opacity:.85;pointer-events:none;transition:opacity .2s}
.scrub{touch-action:none;cursor:grab}
.pbar{width:80%;height:12px;border-radius:99px;background:#fff;border:2px solid var(--pu2);overflow:hidden}
.pbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pu),var(--pk))}
.swg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%}
.sw{position:relative;border:3px solid #fff;border-radius:50%;aspect-ratio:1;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 0 12%,transparent 30%),var(--c);box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;padding:0;font:inherit}
.sw span{position:absolute;left:-6px;right:-6px;top:100%;margin-top:1px;font-size:8.5px;font-weight:800;color:var(--dk);white-space:nowrap;overflow:hidden;text-align:center}
.sw.pw{animation:glw 1.4s infinite alternate}
@keyframes glw{to{box-shadow:0 0 12px 3px var(--pk2)}}
.sw.sel{outline:4px solid var(--pu);transform:scale(1.1)}
.sw .bd{position:absolute;right:-5px;top:-7px;font-style:normal;font-size:14px}
#sw{width:100%;padding-bottom:14px}
.cvw{position:relative;width:min(100%,330px);aspect-ratio:320/300;flex:none;touch-action:none}
.cvw canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.cvw .water{position:absolute;inset:0;border-radius:20px;background:linear-gradient(180deg,rgba(130,210,255,.45),rgba(120,160,255,.6));pointer-events:none}
.cvw.hide .water{display:none}
.ctl{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.styl{display:flex;gap:8px;justify-content:center}
.styl .ghost{font-size:14px;padding:8px 12px}.styl .ghost.on{background:var(--pu);color:#fff}
.tr{width:min(100%,320px);aspect-ratio:300/130;background:#fff;border-radius:16px;border:2px solid var(--pu2);touch-action:none}
.orow{width:100%;overflow-x:auto;display:flex;gap:6px;padding:3px 0;-webkit-overflow-scrolling:touch}
.rowl{font-size:12px;font-weight:900;width:100%;margin-top:2px}
.card{flex:none;width:74px;background:#fff;border:3px solid var(--pu2);border-radius:14px;padding:3px;font:inherit;text-align:center;cursor:pointer;position:relative}
.card svg{width:100%;height:42px}
.card b{display:block;font-size:10px;line-height:1.1}.card small{font-size:9px;color:var(--pu);font-weight:800}
.card.sel{border-color:var(--pk);background:#fff0f8;box-shadow:0 0 10px var(--pk2)}
.card .bd{position:absolute;right:-4px;top:-8px;font-style:normal;font-size:14px}
.card.pw{border-color:#d9a8ff}
/* reveal */
.rvbox{position:relative;width:100%;height:300px;flex:none;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#fff,#ffd9ee);touch-action:none;cursor:ew-resize}
.rvl{position:absolute;inset:0;display:flex;justify-content:center}
.rvl svg{height:100%}
#rvA{clip-path:inset(0 0 0 100%)}
.rvdiv{position:absolute;top:0;bottom:0;width:4px;background:#fff;box-shadow:0 0 8px var(--pk);left:100%}
.rvdiv::after{content:"↔";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--pk);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
.lab{position:absolute;top:6px;background:rgba(59,22,89,.75);color:#fff;border-radius:99px;font-size:11px;padding:2px 9px;font-weight:800}
.sc{width:100%}
.scl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;margin:2px 0}
.scl span:first-child{width:104px}.scl .bar{flex:1;height:10px}.scl b{width:50px;text-align:right}
.big{font-size:42px;font-weight:900;color:var(--pk);text-shadow:0 2px 0 #fff}
.pop{animation:pop .5s cubic-bezier(.3,1.8,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.judges{display:flex;gap:6px;width:100%}
.jd{flex:1;background:#fff;border-radius:14px;padding:5px;font-size:11px;font-weight:700;text-align:center;border:2px solid var(--pu2)}
.jd i{font-style:normal;font-size:24px;display:block}
.scroll{overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;-webkit-overflow-scrolling:touch}
/* meet */
.bubble{background:#fff;border-radius:18px;padding:10px 12px;font-weight:700;font-size:14px;border:2px solid var(--pu2);position:relative;text-align:center}
.mcl{display:flex;gap:8px;justify-content:center;flex:1;min-height:0}
.mcl>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;min-height:0}
.mcl svg{flex:1;min-height:0;max-width:100%}
/* collection */
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.cit{background:#fff;border:2px solid var(--pu2);border-radius:14px;padding:6px;text-align:center;font-size:11px;font-weight:800}
.cit .sq{height:44px;border-radius:12px;margin-bottom:3px;display:flex;align-items:center;justify-content:center;font-size:22px}
.cit.lk{opacity:.5}
.cit svg{height:56px;width:100%}
/* fx */
.fx{position:fixed;pointer-events:none;z-index:99;font-size:18px;animation:fxa .8s ease-out forwards}
@keyframes fxa{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3) rotate(120deg)}}
.fx.b{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.8);border:2px solid #9fd8ff;font-size:0}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%) scale(.9);background:rgba(59,22,89,.92);color:#fff;border-radius:99px;padding:8px 16px;font-weight:800;font-size:14px;z-index:120;opacity:0;pointer-events:none;transition:all .25s;max-width:92%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) scale(1)}
#modal{position:fixed;inset:0;background:rgba(40,10,60,.6);display:none;align-items:center;justify-content:center;z-index:110}
#modal.on{display:flex}
#modal .mb{background:#fff;border-radius:22px;padding:20px;max-width:330px;width:86%;text-align:center;border:3px solid var(--pk);animation:pop .4s both}
#modal .mb p{font-size:16px;font-weight:700;margin:8px 0 14px}
#conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:130}
input.nm{font:inherit;font-weight:800;padding:8px 14px;border-radius:99px;border:3px solid var(--pu2);text-align:center;width:80%;-webkit-user-select:text;user-select:text}
@media (min-width:700px){#app{border-radius:24px;margin-top:2vh;height:96vh;box-shadow:0 0 60px rgba(255,79,163,.5)}}
</style>
</head>
<body>
<div id="app">
  <section id="title" class="screen on"></section>
  <section id="rounds" class="screen"></section>
  <section id="coll" class="screen"></section>
  <section id="meet" class="screen"></section>
  <section id="play" class="screen">
    <div id="hud">
      <div class="ringw" id="ringw"><svg class="rg" viewBox="0 0 58 58"><circle cx="29" cy="29" r="26" fill="#fff" stroke="#e7d7fa" stroke-width="5"/><circle id="ring" cx="29" cy="29" r="26" fill="none" stroke="#9b5de5" stroke-width="5" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="0"/></svg><div class="av" id="av"></div></div>
      <div class="time" id="time">1:30</div>
      <div class="stars" id="hstars" style="font-size:22px"></div>
      <div class="hudr"><div id="hcoins">💰 0</div><div id="hcombo" style="color:var(--pu)"></div></div>
    </div>
    <div class="chips" id="chips"></div>
    <div id="stage"></div>
    <div id="boosts"></div>
    <div class="mrow"><span>✨ Sparkle</span><div class="bar" id="mbar"><i></i></div><span>👜 Dream Bag</span><div class="bar" style="max-width:70px" id="dbar"><i></i></div></div>
  </section>
  <section id="reveal" class="screen"></section>
  <section id="prize" class="screen"></section>
</div>
<div id="toast"></div>
<div id="modal"><div class="mb" id="mb"></div></div>
<canvas id="conf"></canvas>

<script>
"use strict";
/* ============ DATA ============ */
const C=(n,h,g,f)=>({n,h,g,f});
const COLORS={
 cherry:C('Cherry','#d6203a','warm','red'),sun:C('Sunshine','#ffd93b','warm','yellow'),mint:C('Mint','#4fd1b0','cool','green'),
 sky:C('Sky','#4aa8ff','cool','blue'),honey:C('Honey','#e8c39e','neutral','tan'),onyx:C('Onyx','#2a2233','neutral','black'),
 cloud:C('Cloud','#fff7fb','neutral','white'),coral:C('Coral','#ff7a5c','warm','orange'),rust:C('Rust','#b5532a','warm','orange'),
 denim:C('Denim','#3b5f9e','cool','blue'),forest:C('Forest','#2f7d4f','cool','green'),
 hotpink:C('Hot Pink','#ff3fa4','pink','pink'),lavender:C('Lavender','#b79cff','purple','purple'),
 bubblegum:C('Bubblegum','#ff9ccf','pink','pink'),orchid:C('Orchid','#c867d8','purple','purple'),lilac:C('Lilac Haze','#d9c6ff','purple','purple'),
 rosegold:C('Rose Gold','#e8a39a','pink','pink'),ultraviolet:C('Ultra Violet','#6b2cf5','purple','purple'),pinkchrome:C('Pink Chrome','#ff74c8','pink','pink'),
 blush:C('Blush','#ffc7d6','pink','pink'),plum:C('Plum','#7d3a8f','purple','purple'),magenta:C('Magenta','#e0189b','pink','pink'),grape:C('Grape','#8e4fd1','purple','purple'),
 orangeD:C('Neon Orange','#ff8a00','clash','orange'),limeD:C('Lime','#9dff00','clash','green'),neonD:C('Neon Green','#39ff14','clash','green'),plaidD:C('Mustard Plaid','#d4a800','clash','yellow')
};
const BASICS=['cherry','sun','mint','sky','honey','onyx'];
const SHADES=['hotpink','lavender','bubblegum','orchid','lilac','rosegold','ultraviolet','pinkchrome','blush','plum','magenta','grape'];
const START_SHADES=['hotpink','lavender'];
const BANFAM=['red','yellow','green','blue','black','pink'];
const FAMNAME={red:'red',yellow:'yellow',green:'green',blue:'blue',black:'black',pink:'pink',purple:'purple',orange:'orange'};
const isPow=id=>{const g=COLORS[id].g;return g==='pink'||g==='purple'};
const CT={'cool|pink':.3,'cool|purple':.8,'cool|warm':.1,'pink|purple':1,'pink|warm':.6,'purple|warm':.3};
function compat(a,b){if(a==='clash'||b==='clash')return 0;if(a==='neutral'||b==='neutral'||a===b)return 1;return CT[[a,b].sort().join('|')]}

const OPT={
 top:[{id:'sweat',n:'Cozy Sweater',tags:['casual'],col:'lilac',shape:'long'},{id:'tee',n:'Sporty Tee',tags:['casual'],col:'cloud',shape:'tee'},
  {id:'tank',n:'Beach Tank',tags:['beach'],col:'coral',shape:'tank'},{id:'cami',n:'Sparkle Cami',tags:['party'],col:'hotpink',shape:'tank'},
  {id:'blazer',n:'Chic Blazer',tags:['fancy'],col:'onyx',shape:'long'},{id:'satin',n:'Satin Top',tags:['fancy','party'],col:'plum',shape:'tee'},
  {id:'crop',n:'Citrus Crop',tags:['beach','party'],col:'sun',shape:'tank'}],
 bottom:[{id:'jeans',n:'Skinny Jeans',tags:['casual'],col:'denim',shape:'pants'},{id:'leg',n:'Leggings',tags:['casual'],col:'onyx',shape:'pants'},
  {id:'shorts',n:'Beach Shorts',tags:['beach'],col:'cloud',shape:'shorts'},{id:'sarong',n:'Sunset Sarong',tags:['beach','party'],col:'rust',shape:'skirt'},
  {id:'mini',n:'Party Mini',tags:['party'],col:'magenta',shape:'skirt'},{id:'flowy',n:'Flowy Skirt',tags:['fancy','party'],col:'orchid',shape:'long'},
  {id:'satinskirt',n:'Satin Skirt',tags:['fancy'],col:'honey',shape:'long'}],
 shoes:[{id:'sneak',n:'Sneakers',tags:['casual'],col:'cloud',shape:'flat'},{id:'sandal',n:'Sandals',tags:['beach'],col:'honey',shape:'sandal'},
  {id:'flats',n:'Ballet Flats',tags:['casual','fancy'],col:'blush',shape:'flat'},{id:'heels',n:'Classic Heels',tags:['party','fancy'],col:'onyx',shape:'heel'},
  {id:'boots',n:'Ankle Boots',tags:['casual'],col:'rust',shape:'boot'},{id:'glitz',n:'Glitter Heels',tags:['party','fancy'],col:'rosegold',shape:'heel'},
  {id:'wedge',n:'Sun Wedges',tags:['beach','party'],col:'coral',shape:'heel'}]};
const DOPT={top:{id:'d_top',n:'Clashing Plaid',tags:[],col:'plaidD',shape:'long'},bottom:{id:'d_bottom',n:'Odd Skirt',tags:[],col:'limeD',shape:'skirt'},shoes:{id:'d_shoes',n:'Mismatch Boots',tags:[],col:'orangeD',shape:'boot'}};
const getOpt=(cat,id)=>OPT[cat].find(o=>o.id===id)||DOPT[cat];
const BAGS=[{id:'tote',n:'Tote'},{id:'crossbody',n:'Crossbody'},{id:'shoulder',n:'Shoulder'},{id:'mini',n:'Mini'}];

const inEll=(x,y,n,m)=>((x-n.cx)/(n.rx+m))**2+((y-n.cy)/(n.ry+m))**2<=1;
function PaintModel(nails,R,snap){
 this.nails=nails;this.R=R;this.snap=snap;this.pts=[];this.per=nails.map(()=>0);this.tot=nails.map(()=>0);this.filled=nails.map(()=>false);this.cells=new Set();this.gems=[];
 nails.forEach((n,i)=>{for(let y=n.cy-n.ry;y<=n.cy+n.ry;y+=3)for(let x=n.cx-n.rx;x<=n.cx+n.rx;x+=3)if(inEll(x,y,n,0)){this.pts.push({x,y,i,p:0});this.tot[i]++}});
 this.all=this.pts.length;this.cnt=0}
PaintModel.prototype.dab=function(x,y,out){
 const R=this.R,r2=(R*.9)*(R*.9);
 for(const p of this.pts){if(!p.p){const dx=p.x-x,dy=p.y-y;if(dx*dx+dy*dy<=r2){p.p=1;this.per[p.i]++;this.cnt++}}}
 const rs=R*.7,sm=[[0,0]];for(let k=0;k<8;k++)sm.push([Math.cos(k*.785)*rs,Math.sin(k*.785)*rs]);
 for(const s of sm){const sx=x+s[0],sy=y+s[1];if(!this.nails.some(n=>inEll(sx,sy,n,3)))this.cells.add(Math.floor(sx/6)+','+Math.floor(sy/6))}
 if(this.snap)this.nails.forEach((n,i)=>{if(!this.filled[i]&&this.per[i]/this.tot[i]>=.55){this.filled[i]=true;this.pts.forEach(p=>{if(p.i===i&&!p.p){p.p=1;this.cnt++}});this.per[i]=this.tot[i];if(out)out.push(i)}})};
PaintModel.prototype.stroke=function(x0,y0,x1,y1){
 const out=[],d=Math.hypot(x1-x0,y1-y0),st=Math.max(1,Math.ceil(d/(this.R/3)));
 for(let k=1;k<=st;k++)this.dab(x0+(x1-x0)*k/st,y0+(y1-y0)*k/st,out);return out};
PaintModel.prototype.cov=function(){return this.cnt/this.all};
PaintModel.prototype.spill=function(){return Math.min(1,this.cells.size/30)};
PaintModel.prototype.neat=function(){return clamp(this.cov()/.92,0,1)*(1-(this.snap?.25:.7)*this.spill())};
PaintModel.prototype.nailAt=function(x,y){let b=-1,bd=1e9;this.nails.forEach((n,i)=>{const d=Math.hypot(x-n.cx,y-n.cy);if(d<Math.max(n.rx,n.ry)+14&&d<bd){bd=d;b=i}});return b};

function mkPath(style){const a=[];
 if(style==='straight')for(let x=25;x<=275;x+=4)a.push([x,65]);
 else if(style==='curl')for(let x=25;x<=275;x+=3)a.push([x,65+38*Math.sin((x-25)/250*Math.PI*4)]);
 else{const pts=[[25,100],[65,28],[105,100],[145,28],[185,100],[225,28],[275,100]];
  for(let i=0;i<pts.length-1;i++)for(let k=0;k<20;k++)a.push([pts[i][0]+(pts[i+1][0]-pts[i][0])*k/20,pts[i][1]+(pts[i+1][1]-pts[i][1])*k/20]);a.push(pts[pts.length-1])}
 return a}
function TraceModel(path,tol){this.path=path;this.tol=tol;this.n=0;this.ok=0;this.hit=new Set();this.B=24}
TraceModel.prototype.add=function(x,y){let bi=0,bd=1e9;this.path.forEach((p,i)=>{const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;bi=i}});
 this.n++;if(bd<=this.tol){this.ok++;this.hit.add(Math.floor(bi/this.path.length*this.B))}return bd<=this.tol};
TraceModel.prototype.cov=function(){return this.hit.size/this.B};
TraceModel.prototype.acc=function(){return this.n?this.ok/this.n:0};
TraceModel.prototype.neat=function(){return clamp(this.cov()/.9,0,1)*(.4+.6*this.acc())};

 if(kind==='nails'){lay.nails.forEach(n=>cap(n.cx,n.cy-n.ry-10,n.rx*2+14,n.cx>260?255:250));ctx.beginPath();ctx.ellipse(165,262,150,60,0,0,7);ctx.fill()}
 else{ctx.beginPath();ctx.ellipse(168,215,100,105,0,0,7);ctx.fill();ctx.stroke();lay.nails.forEach(n=>{ctx.beginPath();ctx.arc(n.cx,n.cy+4,n.rx+9,0,7);ctx.fill();ctx.stroke()});ctx.beginPath();ctx.ellipse(168,215,100,105,0,0,7);ctx.fill()}
 lay.nails.forEach((n,i)=>{ctx.beginPath();ctx.ellipse(n.cx,n.cy,n.rx,n.ry,0,0,7);
  if(bareNails){ctx.fillStyle='#fff0f5'}else{ctx.fillStyle=fillCol}ctx.fill();ctx.lineWidth=2.5;ctx.setLineDash(bareNails?[5,4]:[]);ctx.strokeStyle=bareNails?'#ff4fa3':'rgba(0,0,0,.25)';ctx.stroke();ctx.setLineDash([]);
  if(!bareNails){ctx.fillStyle=skin;for(let k=0;k<4;k++){ctx.beginPath();ctx.arc(n.cx+(((i*7+k*13)%20)-10),n.cy+(((i*11+k*9)%24)-12),3+k%2,0,7);ctx.fill()}}});
 ctx.fillStyle=skin}

 ctx.fillStyle=g;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s*.8,y-s*.2);ctx.lineTo(x,y+s);ctx.lineTo(x-s*.8,y-s*.2);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(x-s*.8,y-s*.2);ctx.lineTo(x+s*.8,y-s*.2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.fillText('✦',x+s*.7,y-s*.6)}
